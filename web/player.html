<!doctype html>
<html><head>
  <meta charset="UTF-8" />
  <style>
    /* center the canvas and scale it down to fit while preserving aspect; the
       canvas keeps its pixel resolution (the actual render size). */
    html, body { margin:0; height:100%; background:#000; overflow:hidden;
                 display:flex; align-items:center; justify-content:center; }
    canvas { display:block; max-width:100%; max-height:100%; }
  </style>
</head><body>
  <canvas id="canvas" width="480" height="360" tabindex="0"></canvas>
  <script type="module" src="/playground/player.ts"></script>
</body></html>
