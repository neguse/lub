<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lub docs</title>
    <style>
      :root {
        --bg: #1d1f21;
        --bg-code: #16181a;
        --bg-side: #181a1c;
        --fg: #ddd;
        --fg-dim: #999;
        --accent: #7cb3e8;
        --border: #333;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
        line-height: 1.7;
      }
      #topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 8px 16px;
        background: #111;
        border-bottom: 1px solid var(--border);
      }
      #topbar .title {
        font-weight: 600;
      }
      #topbar a {
        color: var(--accent);
        text-decoration: none;
        font-size: 13px;
      }
      #search {
        margin-left: auto;
        background: #222;
        color: var(--fg);
        border: 1px solid var(--border);
        padding: 4px 8px;
        font-size: 13px;
        width: 200px;
      }
      #layout {
        display: grid;
        grid-template-columns: 240px minmax(0, 1fr);
      }
      #side {
        position: sticky;
        top: 41px;
        height: calc(100vh - 41px);
        height: calc(100dvh - 41px);
        overflow-y: auto;
        background: var(--bg-side);
        border-right: 1px solid var(--border);
        padding: 8px 0 24px;
        font-size: 13px;
      }
      #side .group {
        padding: 10px 16px 2px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--fg-dim);
      }
      #side a {
        display: block;
        padding: 2px 16px;
        color: var(--fg);
        text-decoration: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #side a:hover {
        background: #24272a;
      }
      #side a.hidden {
        display: none;
      }
      #content {
        max-width: 860px;
        padding: 16px 32px 30vh;
      }
      #content h1 {
        font-size: 26px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 6px;
        margin-top: 48px;
      }
      #content h2 {
        font-size: 21px;
        margin-top: 40px;
      }
      #content h1:first-child {
        margin-top: 8px;
      }
      #content a {
        color: var(--accent);
      }
      #content table {
        border-collapse: collapse;
        font-size: 14px;
      }
      #content th,
      #content td {
        border: 1px solid var(--border);
        padding: 4px 10px;
        text-align: left;
      }
      code {
        font-family: ui-monospace, monospace;
        font-size: 0.92em;
        background: var(--bg-code);
        padding: 1px 5px;
        border-radius: 3px;
      }
      pre {
        background: var(--bg-code);
        border: 1px solid #26292c;
        border-radius: 6px;
        padding: 12px 14px;
        overflow-x: auto;
      }
      pre code {
        background: none;
        padding: 0;
      }
      .type-header {
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
      }
      .type-header .kind {
        font-size: 12px;
        color: var(--fg-dim);
      }
      .type-header .src {
        font-size: 12px;
        margin-left: auto;
      }
      .member {
        margin: 18px 0;
        scroll-margin-top: 56px;
      }
      .member > pre.sig {
        margin: 0 0 6px;
        padding: 8px 12px;
        border-left: 3px solid #3a5a78;
      }
      .member > pre.sig .lua {
        float: right;
        font-size: 12px;
        color: var(--fg-dim);
      }
      .member .mdoc {
        margin-left: 12px;
      }
      .member .mdoc p:first-child {
        margin-top: 4px;
      }
      section[id] {
        scroll-margin-top: 56px;
      }
      .aux-type {
        margin-top: 32px;
      }
      #content .badge {
        font-size: 11px;
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 0 6px;
        color: var(--fg-dim);
      }
      @media (max-width: 760px) {
        #layout {
          grid-template-columns: 1fr;
        }
        #side {
          position: static;
          height: auto;
          max-height: 40vh;
          border-right: none;
          border-bottom: 1px solid var(--border);
        }
      }
    </style>
  </head>
  <body>
    <div id="topbar">
      <span class="title">lub docs</span>
      <a href="/">← Playground</a>
      <a href="https://github.com/neguse/lub" target="_blank" rel="noopener"
        >GitHub</a
      >
      <input id="search" type="search" placeholder="filter (name)" />
    </div>
    <div id="layout">
      <nav id="side"></nav>
      <main id="content">loading…</main>
    </div>
    <script type="module" src="/playground/docs.ts"></script>
  </body>
</html>
