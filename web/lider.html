<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>lider</title>
    <style>
      /* 窓の字と同じ書体にし、ページの部品をエディタの一部に見せる。地は夜の藍、押せる物の印は focus の青 */
      @font-face {
        font-family: "Yutapon Coding";
        src: url("lider-fs/data/yutapon_coding_081d.ttf");
      }
      :root {
        --ink: #e8ecf6;
        --muted: #8f97b5;
        --surface: #0e1226;
        --line: #ffffff17;
        --focus: #8fa8ff;
        --ok: #8fd0a8;
        --danger: #ff9aa2;
        --face: "Yutapon Coding", ui-monospace, monospace;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      #status {
        position: fixed;
        left: 12px;
        bottom: 12px;
        max-width: 60vw;
        padding: 5px 10px;
        border-radius: 8px;
        background: #0e1226cc;
        backdrop-filter: blur(10px);
        color: var(--ok);
        font: 13px var(--face);
        pointer-events: none;
        white-space: pre-wrap;
        transition: opacity 0.4s;
      }
      #status.idle {
        opacity: 0;
      }
      #status.error {
        color: var(--danger);
      }
      /* lider を出さずに始めたときの、出し方の案内。メニューのボタンの左に置く */
      #hint {
        position: fixed;
        right: 52px;
        bottom: 12px;
        padding: 0 10px;
        border-radius: 8px;
        background: #0e1226cc;
        backdrop-filter: blur(10px);
        color: var(--muted);
        font: 13px/32px var(--face);
        pointer-events: none;
      }
      #tools {
        position: fixed;
        right: 12px;
        bottom: 12px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        font: 14px var(--face);
      }
      #menu {
        display: none;
        flex-direction: column;
        min-width: 160px;
        padding: 6px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #0e1226ee;
        backdrop-filter: blur(16px);
        box-shadow: 0 12px 32px #00000080;
      }
      #tools.open #menu {
        display: flex;
      }
      #tools hr {
        width: 100%;
        margin: 4px 0;
        border: 0;
        border-top: 1px solid var(--line);
      }
      #menu button {
        padding: 7px 10px;
        border: 0;
        border-radius: 4px;
        background: none;
        color: var(--ink);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      #menu button:hover {
        background: #8fa8ff33;
      }
      #menu button.danger {
        color: var(--danger);
      }
      #toggle {
        width: 32px;
        height: 32px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #0e1226cc;
        backdrop-filter: blur(16px);
        color: var(--muted);
        font: 16px var(--face);
        cursor: pointer;
      }
      #tools button:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 1px;
      }
      @media (prefers-reduced-motion: reduce) {
        #status {
          transition: none;
        }
      }
      #toggle:hover {
        color: var(--ink);
        background: #1a2142e6;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" tabindex="0"></canvas>
    <div id="status"></div>
    <div id="hint" hidden>F1 で編集</div>
    <div id="tools">
      <div id="menu">
        <button id="export">zip に保存</button>
        <button id="import">zip を開く</button>
        <hr />
        <button id="gist" class="danger" hidden>gist に戻す</button>
        <button id="empty" class="danger">空から始める</button>
        <button id="flappy" class="danger">Flappy に戻す</button>
      </div>
      <button id="toggle" aria-label="メニュー">...</button>
    </div>
    <script type="module" src="/lider/main.ts"></script>
  </body>
</html>
