# apt の package を入れる。取ってきた .deb を cache に置き、次からは mirror に行かずにそれを入れる。
name: apt-install
description: Install apt packages, reusing the downloaded .deb files from the cache
inputs:
  packages:
    description: 空白で区切った package の名前
    required: true
runs:
  using: composite
  steps:
    # 入る .deb は、package の名前と、runner の image に入っている物で決まる。
    # 同じ時期でも runner によって image の版が違うので、restore-keys は image の版の手前までにし、別の版の image で取った .deb も試す。
    # その .deb がこの image に合わなければ (依存の版が違う、入っている物より古い)、dpkg が断るので、mirror から取り直す
    - id: key
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: echo "prefix=apt-${{ runner.arch }}-${ImageOS:-}-$(echo $PACKAGES | git hash-object --stdin)-" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v4
      with:
        path: ~/.cache/lub-apt
        key: ${{ steps.key.outputs.prefix }}${{ env.ImageVersion }}
        restore-keys: ${{ steps.key.outputs.prefix }}

    - name: Install the packages
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        # initramfs は runner で使わないので、package の trigger で作り直させない
        conf=/etc/initramfs-tools/update-initramfs.conf
        [ ! -f "$conf" ] || sudo sed -i 's/^update_initramfs=.*/update_initramfs=no/' "$conf"
        dir="$HOME/.cache/lub-apt"
        # 置いてある .deb を入れる。apt に渡すと同じ版を mirror から取り直すので、dpkg で入れる
        install() {
          shopt -s nullglob
          local debs=("$dir"/*.deb)
          [ -f "$dir/done" ] && { [ ${#debs[@]} = 0 ] || sudo dpkg --refuse-downgrade -i "${debs[@]}"; }
        }
        install && exit 0
        # .deb が無いか、この image に合わないときは、mirror から取って入れ、取った .deb を置く
        rm -rf "$dir"
        mkdir -p "$dir"
        # runner の image にある Google Chrome の apt source は、metadata の Hash Sum mismatch を時々出して update ごと落とす。ここでは使わない
        sudo rm -f /etc/apt/sources.list.d/google-chrome*
        sudo apt-get update
        # dpkg が合わない .deb を途中まで入れていたら、先に揃え直す (揃っていないと、apt は package を指定した install を断る)
        sudo apt-get install -y --fix-broken
        # shellcheck disable=SC2086
        sudo apt-get install -y --no-install-recommends -o Dir::Cache::archives="$dir" -o APT::Keep-Downloaded-Packages=true $PACKAGES
        sudo chown -R "$(id -u)" "$dir"
        rm -rf "$dir/partial" "$dir/lock"
        touch "$dir/done"
