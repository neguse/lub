# Installs apt packages. Keeps the downloaded .deb files in the cache and, for the same packages on the same image, installs them from there instead of going to the mirror.
name: apt-install
description: Install apt packages, reusing the downloaded .deb files from the cache
inputs:
  packages:
    description: 空白で区切った package の名前
    required: true
runs:
  using: composite
  steps:
    # The .deb files that get installed depend on the package names and on what the runner image already contains. The key holds both, and .deb files fetched on a different image version are not used
    - id: key
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: echo "key=apt-${{ runner.arch }}-${ImageOS:-}-${ImageVersion:-}-$(echo $PACKAGES | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

    - id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/lub-apt
        key: ${{ steps.key.outputs.key }}

    # initramfs is not used on the runner, so do not let package triggers regenerate it
    - shell: bash
      run: |
        conf=/etc/initramfs-tools/update-initramfs.conf
        [ ! -f "$conf" ] || sudo sed -i 's/^update_initramfs=.*/update_initramfs=no/' "$conf"

    # Install the stored .deb files. Passing them to apt makes it fetch the same version again from the mirror, so install them with dpkg
    - name: Install the cached packages
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        shopt -s nullglob
        debs=(~/.cache/lub-apt/*.deb)
        [ ${#debs[@]} = 0 ] || sudo dpkg -i "${debs[@]}"

    - name: Install the packages from the mirror
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        dir="$HOME/.cache/lub-apt"
        rm -rf "$dir"
        mkdir -p "$dir"
        # The Google Chrome apt source in the runner image sometimes reports a metadata Hash Sum mismatch and fails the whole update. It is not used here
        sudo rm -f /etc/apt/sources.list.d/google-chrome*
        sudo apt-get update
        # Keep the fetched .deb files (later runs install them)
        # shellcheck disable=SC2086
        sudo apt-get install -y --no-install-recommends -o Dir::Cache::archives="$dir" -o APT::Keep-Downloaded-Packages=true $PACKAGES
        sudo chown -R "$(id -u)" "$dir"
        rm -rf "$dir/partial" "$dir/lock"
