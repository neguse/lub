# apt の package を入れる。取ってきた .deb を cache に置き、同じ image で同じ package なら mirror に行かずにそれを入れる。
name: apt-install
description: Install apt packages, reusing the downloaded .deb files from the cache
inputs:
  packages:
    description: 空白で区切った package の名前
    required: true
runs:
  using: composite
  steps:
    # 入る .deb は、package の名前と、runner の image に入っている物で決まる。key はその両方を持ち、別の版の image で取った .deb は使わない
    - id: key
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: echo "key=apt-${{ runner.arch }}-${ImageOS:-}-${ImageVersion:-}-$(echo $PACKAGES | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

    - id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/lub-apt
        key: ${{ steps.key.outputs.key }}

    # initramfs は runner で使わないので、package の trigger で作り直させない
    - shell: bash
      run: |
        conf=/etc/initramfs-tools/update-initramfs.conf
        [ ! -f "$conf" ] || sudo sed -i 's/^update_initramfs=.*/update_initramfs=no/' "$conf"

    # 置いてある .deb を入れる。apt に渡すと同じ版を mirror から取り直すので、dpkg で入れる
    - name: Install the cached packages
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        shopt -s nullglob
        debs=(~/.cache/lub-apt/*.deb)
        [ ${#debs[@]} = 0 ] || sudo dpkg -i "${debs[@]}"

    - name: Install the packages from the mirror
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        dir="$HOME/.cache/lub-apt"
        rm -rf "$dir"
        mkdir -p "$dir"
        # runner の image にある Google Chrome の apt source は、metadata の Hash Sum mismatch を時々出して update ごと落とす。ここでは使わない
        sudo rm -f /etc/apt/sources.list.d/google-chrome*
        sudo apt-get update
        # 取った .deb を置く (次からはそれを入れる)
        # shellcheck disable=SC2086
        sudo apt-get install -y --no-install-recommends -o Dir::Cache::archives="$dir" -o APT::Keep-Downloaded-Packages=true $PACKAGES
        sudo chown -R "$(id -u)" "$dir"
        rm -rf "$dir/partial" "$dir/lock"
