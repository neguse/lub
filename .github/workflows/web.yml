# web playground (lub.neguse.net) の build → verify → deploy。
# pull_request では build + verify までをマージ gate として実行し、
# master push / workflow_dispatch では同じ verify を通した上でデプロイする。
# local の `cd web && npm run deploy` は脱出ハッチとして残す。
#
# 前提アセット (web/README.md) の供給:
#   - lub player wasm: emsdk でこの job 内でビルド
#   - tcs WasmCompiler: dotnet wasm-tools で publish (gen-tcs --publish)
name: web

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# deploy 系 (master push / dispatch) は直列 (cancel しない)。
# PR は ref ごとに group を分け、同一 PR への連続 push は前の run を止める。
concurrency:
  group: web-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.2
          actions-cache-folder: emsdk-cache

      - name: Build lub player wasm
        run: |
          emcmake cmake --preset wasm-release
          cmake --build build/wasm -j

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci (postinstall が slang-wasm を fetch)
        working-directory: web
        run: npm ci

      - name: Generate tcs wasm assets
        working-directory: web
        run: npm run gen-tcs -- --publish

      - name: Generate tcs prebuilt snapshots
        working-directory: web
        run: npm run gen-tcs-prebuilt

      # verify が使う __lubTest hook (editor.ts) は dev/test mode 限定で
      # production build には入らない。verify は test mode build に対して行い、
      # deploy する production build は verify 後に作り直す。
      - name: Build site (test mode for verify)
        working-directory: web
        run: |
          npm run gen-api
          npx vite build --mode test

      - name: Install chromium (verify)
        working-directory: web
        run: npx playwright install --with-deps chromium

      # dist を vite preview で配信し、deploy 前の実体を verify する。
      # golden は tests/golden/*_web.png との byte 比較 (swiftshader +
      # fixed-dt。chromium は playwright の version 固定で決定的)。
      - name: Verify headless + web goldens (playwright + swiftshader)
        working-directory: web
        run: |
          npm run preview -- --port 4173 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ >/dev/null && break
            sleep 1
          done
          LUB_URL=http://localhost:4173/ npm run verify
          LUB_URL=http://localhost:4173/ npm run golden

      - name: Upload verify screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-screenshots
          path: |
            /tmp/lub-verify
            /tmp/lub-golden-web
          if-no-files-found: ignore

      - name: Build site (production)
        if: github.event_name != 'pull_request'
        working-directory: web
        run: npm run build

      - name: Deploy (wrangler)
        if: github.event_name != 'pull_request'
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
