# Run on the iOS simulator: run the tests/cs tests meant for iOS in a simulator app (scripts/ios-gate.sh).
# On hosted runners just starting the simulator takes minutes, so this does not run in PR CI (ci.yml).
#   - master push: this workflow runs on its own. If it fails, the check for that commit fails, which makes it visible (deploy is on the ci.yml side and does not wait for this)
#   - tag (v*) push: ci.yml calls this workflow, and publish waits for it
name: ios

on:
  push:
    branches: [master]
  workflow_call:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CCACHE_MAXSIZE: 500M
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_OBJC_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4

      # Fetch only the needed submodules, in parallel
      - name: Submodules
        run: git submodule update --init --depth 1 --jobs 8 third_party/SDL third_party/box2d third_party/box3d third_party/openxr

      - name: Cache slang prebuilts
        uses: actions/cache@v4
        with:
          path: third_party/slang/lib
          key: slang-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      # The macOS player (which fills the shader cache) uses the same deps as the macos job. The iOS app deps are cached separately
      - name: Deps cache key
        id: deps
        run: |
          bash scripts/deps-cache-key.sh macos >> "$GITHUB_OUTPUT"
          bash scripts/deps-cache-key.sh ios | sed 's/^/ios_/' >> "$GITHUB_OUTPUT"

      - name: Restore deps (macOS)
        uses: actions/cache/restore@v4
        with:
          path: |
            build-mac/deps
            build-mac-player/deps
          key: ${{ steps.deps.outputs.key }}
          restore-keys: ${{ steps.deps.outputs.restore }}

      - name: Cache deps (iOS)
        uses: actions/cache@v4
        with:
          path: build-ios/deps
          key: ${{ steps.deps.outputs.ios_key }}
          restore-keys: ${{ steps.deps.outputs.ios_restore }}

      - name: Install tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: brew install bash ninja

      # Pinned-version ccache (scripts/install-ccache.sh)
      - name: Install ccache
        run: bash scripts/install-ccache.sh

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-ios-${{ github.sha }}
          restore-keys: ccache-ios-

      # The tests/cs tests are C#, so the bytecode to put in the app is built with tcs.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Build the macOS player (which fills the shader cache) and the iOS app, and run on the simulator
      - name: iOS gate (iOS build, simulator)
        run: |
          export TMPDIR="${RUNNER_TEMP}/ios-gate-tmp"
          mkdir -p "$TMPDIR"
          bash scripts/ios-gate.sh

      - name: Save ccache
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-ios-${{ github.sha }}

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-ios
          path: ${{ runner.temp }}/ios-gate-tmp
          if-no-files-found: ignore

  # The only required check.
  # Green if all awaited jobs succeed.
