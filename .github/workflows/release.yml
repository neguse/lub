# release の一式 (docs/release-kit.md) を作り、iOS の simulator で player を確かめる。
# tag (v*) の push で、両方が通れば GitHub の release に lub-linux-x64.tar.gz を載せる。
# `-` を含む tag (v0.2.0-rc.1 など) は prerelease にする (releases/latest の対象にならない)。
# これらを変える PR では、載せずに確かめるところまで走る。
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package-release.sh
      - docs/release-kit.md
      - scripts/apple-gate.sh

permissions:
  contents: write

jobs:
  linux-x64:
    # glibc 2.39 の環境 (claude.ai の sandbox など) でも動くよう、Ubuntu 24.04 で build する
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache slang prebuilts
        uses: actions/cache@v4
        with:
          path: |
            third_party/slang/lib
            third_party/slang/bin
          key: slang-dxc-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Cache emsdk
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-5.0.2

      - name: Install system deps
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build patchelf libvulkan-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libdecor-0-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libudev-dev

      - name: Install emsdk
        run: |
          if [ ! -x "$HOME/emsdk/emsdk" ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk "$HOME/emsdk"
          fi
          "$HOME/emsdk/emsdk" install 5.0.2
          "$HOME/emsdk/emsdk" activate 5.0.2

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build lub (Linux x64)
        run: bash scripts/build-release.sh --build-dir build-release-linux

      - name: Build the web player (wasm)
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          emcmake cmake --preset wasm-release
          cmake --build build/wasm -j

      - name: Publish tcs (NativeAOT)
        run: dotnet publish third_party/tcs/Transpiler -c Release -r linux-x64 -p:PublishAot=true -o "$RUNNER_TEMP/tcs"

      - name: Package
        run: bash scripts/package-release.sh build-release-linux build/wasm "$RUNNER_TEMP/tcs" dist/lub-linux-x64.tar.gz

      # 一式だけを展開した所で、雛形のゲームを web に export できること (リポジトリの tcs や cs-lib を使わない)。
      - name: Export the template with the kit
        run: |
          kit="$RUNNER_TEMP/kit"
          mkdir -p "$kit"
          tar xf dist/lub-linux-x64.tar.gz -C "$kit"
          cp -r "$kit/lub/templates/game" "$kit/mygame"
          cd "$kit/mygame"
          ../lub/bin/lub export web Game.csproj -o out
          ../lub/bin/tcs/Transpiler --snapshot --entry Game Game.cs $(find ../lub/cs-lib -name '*.cs' ! -name lub_stub.cs) --ref ../lub/cs-lib/lub_stub.cs -o snapshot.lua
          test -s ../lub/manual/tcs-support-matrix.md
          test -s ../lub/COMMIT
          test -s out/index.html
          test -s snapshot.lua
          grep -qa '@fragment' out/cache/shader/*.lubshader

      - name: Upload the kit
        uses: actions/upload-artifact@v4
        with:
          name: lub-linux-x64
          path: dist/lub-linux-x64.tar.gz

  # tests/cs のうち iOS で走らせるものを、simulator の app で動かす (scripts/apple-gate.sh --part ios)。
  # simulator の起動の遅さは runner 次第で揺れるので PR の CI には置かない。
  # 落ちたら job を再実行する。
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CCACHE_DIR: /Users/runner/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache slang prebuilts
        uses: actions/cache@v4
        with:
          path: third_party/slang/lib
          key: slang-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      # macOS の build は ci.yml の macos job と同じなので、master で貯まるその ccache を借りる (tag の run が保存しても次の tag からは見えない)。
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-macos-${{ github.sha }}
          restore-keys: ccache-macos-

      - name: Install tools
        run: brew install bash ninja ccache

      # tests/cs の test は C# なので、app に入れる Lua を tcs で作る。
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # macOS の player (shader cache を埋める) と iOS の app の build、simulator での実行
      - name: Apple gate, iOS part (iOS build, simulator)
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CMAKE_OBJC_COMPILER_LAUNCHER: ccache
        run: |
          export TMPDIR="${RUNNER_TEMP}/apple-gate-tmp"
          mkdir -p "$TMPDIR"
          bash scripts/apple-gate.sh --part ios

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-ios
          path: ${{ runner.temp }}/apple-gate-tmp
          if-no-files-found: ignore

  publish:
    needs: [linux-x64, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lub-linux-x64
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=()
          case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/lub-linux-x64.tar.gz \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes "${pre[@]}"
