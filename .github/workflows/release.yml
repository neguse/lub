# release の一式 (docs/release-kit.md) を OS と CPU の組 (target) ごとに作って確かめ、iOS の simulator で player を確かめる。
# tag (v*) の push で、全部が通れば GitHub の release に一式 (lub-<target>.tar.gz、Windows は lub-<target>.zip) を載せる。
# `-` を含む tag (v0.2.0-rc.1 など) は prerelease にする (releases/latest の対象にならない)。
# これらを変える PR では、載せずに確かめるところまで走る。
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package-release.sh
      - scripts/verify-release-kit.sh
      - docs/release-kit.md
      - scripts/apple-gate.sh
      - lider/kit/**
      - lider/scripts/build-dict.sh

permissions:
  contents: write

jobs:
  # OS によらない物: web の player (wasm)、lider の bytecode (Lider.tcsb)、かな漢字変換の辞書 (mozc.dict)
  common:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache emsdk
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-5.0.2

      - name: Install system deps
        run: |
          # runner イメージ同梱の Google Chrome の apt source は metadata の Hash Sum mismatch を時々出して update ごと落とす。
          # ここでは使わない
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Install emsdk
        run: |
          if [ ! -x "$HOME/emsdk/emsdk" ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk "$HOME/emsdk"
          fi
          "$HOME/emsdk/emsdk" install 5.0.2
          "$HOME/emsdk/emsdk" activate 5.0.2

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build the web player (wasm)
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          emcmake cmake --preset wasm-release
          cmake --build build/wasm --target lub_vm
          mkdir -p common/wasm/vm
          cp build/wasm/vm/lub.js build/wasm/vm/lub.wasm common/wasm/vm/

      - name: Build Lider.tcsb
        run: bash lider/scripts/build-module.sh common/lider/Lider.tcsb

      # mozc の辞書を固定した commit で取って作り、1 文を変換して確かめる
      - name: Build the dictionary
        run: bash lider/scripts/build-dict.sh common/dict

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kit-common
          path: common

  # target ごとの一式。lub、tcs、lub-gen、lider の player をその target の上で build し、common の物と一緒に固めて確かめる
  kit:
    needs: common
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.39 の環境 (claude.ai の sandbox など) でも動くよう、Linux は Ubuntu 24.04 で build する
          - target: linux-x64
            os: ubuntu-24.04
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: windows-x64
            os: windows-latest
            arch: x64
          - target: windows-arm64
            os: windows-11-arm
            arch: arm64
          - target: macos-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache prebuilts
        uses: actions/cache@v4
        with:
          path: |
            third_party/slang/lib
            third_party/slang/bin
            third_party/d3d12agility
          key: release-prebuilt-${{ matrix.target }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update
          # mesa-vulkan-drivers (lavapipe) と xvfb は、一式の lider を描かせて確かめるのに使う
          sudo apt-get install -y --no-install-recommends \
            ninja-build patchelf libvulkan-dev mesa-vulkan-drivers xvfb \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libdecor-0-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libudev-dev

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install bash ninja

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: dtolnay/rust-toolchain@stable

      - name: Build lub
        run: |
          cmake -S . -B build-kit -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-kit

      # tcs2c で C にした tcs (.NET の tcs と同じ出力を出すことも確かめる)。生成した C は GNU C の文の式を使うので、Linux 以外は clang で build する
      - name: Build tcs
        run: |
          [ "$RUNNER_OS" = Linux ] || export CC=clang
          bash scripts/build-tcs-native.sh build-kit

      # lub-gen (TinyC#) を C の tcs で C にする (.NET で動かした lub-gen と同じ出力を出すことも確かめる)
      - name: Build lub-gen
        run: |
          [ "$RUNNER_OS" = Linux ] || export CC=clang
          bash scripts/build-lub-gen.sh --verify build-kit

      # lider の player は、tcs2c で C にした tcs の compiler を含む。Windows は MSVC と同じ ABI の clang-cl で build し、MSVC で build した lub と link する
      - name: Build the lider player
        run: |
          [ "$RUNNER_OS" = Windows ] && export CC=clang-cl CXX=clang-cl
          LUB_BUILD="$PWD/build-kit" bash lider/scripts/build-player.sh

      - uses: actions/download-artifact@v4
        with:
          name: kit-common
          path: common

      - name: Package
        run: bash scripts/package-release.sh ${{ matrix.target }} build-kit common dist

      # 一式だけを展開した所で、雛形を export、check し、lider で開いて動かす。
      # 描画は、Linux は lavapipe (CPU の Vulkan) と仮想の画面、Windows は WARP (CPU の D3D12)、macOS は runner の GPU
      - name: Verify the kit
        run: |
          kit=$(ls dist/lub-${{ matrix.target }}.*)
          case "$RUNNER_OS" in
            Linux)
              VK_ICD_FILENAMES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)" xvfb-run -a bash scripts/verify-release-kit.sh "$kit"
              ;;
            Windows)
              LUB_D3D12_WARP=1 bash scripts/verify-release-kit.sh "$kit"
              ;;
            *)
              bash scripts/verify-release-kit.sh "$kit"
              ;;
          esac

      - name: Upload the kit
        uses: actions/upload-artifact@v4
        with:
          name: lub-${{ matrix.target }}
          path: dist/lub-${{ matrix.target }}.*

  # tests/cs のうち iOS で走らせるものを、simulator の app で動かす (scripts/apple-gate.sh --part ios)。
  # simulator の起動の遅さは runner 次第で揺れるので PR の CI には置かない。
  # 落ちたら job を再実行する。
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CCACHE_DIR: /Users/runner/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache slang prebuilts
        uses: actions/cache@v4
        with:
          path: third_party/slang/lib
          key: slang-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      # macOS の build は ci.yml の macos job と同じなので、master で貯まるその ccache を借りる (tag の run が保存しても次の tag からは見えない)。
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-macos-${{ github.sha }}
          restore-keys: ccache-macos-

      - name: Install tools
        run: brew install bash ninja ccache

      # tests/cs の test は C# なので、app に入れる bytecode を tcs で作る。
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # macOS の player (shader cache を埋める) と iOS の app の build、simulator での実行
      - name: Apple gate, iOS part (iOS build, simulator)
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CMAKE_OBJC_COMPILER_LAUNCHER: ccache
        run: |
          export TMPDIR="${RUNNER_TEMP}/apple-gate-tmp"
          mkdir -p "$TMPDIR"
          bash scripts/apple-gate.sh --part ios

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-ios
          path: ${{ runner.temp }}/apple-gate-tmp
          if-no-files-found: ignore

  publish:
    needs: [kit, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lub-*
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=()
          case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes "${pre[@]}"
