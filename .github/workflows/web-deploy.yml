# web playground (lub.neguse.net) の build → verify → deploy。
# master push でデプロイし、pull_request ではデプロイしない。
# local の `cd web && npm run deploy` は脱出ハッチとして残す。
#
# 前提アセット3つ (web/README.md) の供給:
#   - lub player wasm: emsdk でこの job 内でビルド
#   - tcs WasmCompiler: dotnet wasm-tools で publish (gen-tcs --publish)
#   - Haxe compiler wasm: haxe-wasm/dist を actions/cache し、cache miss 時だけ
#     docker で再現ビルド (haxe-wasm/build.sh、~1h。key の入力が変わらない限り走らない)
name: web-deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.2
          actions-cache-folder: emsdk-cache

      - name: Build lub player wasm
        run: |
          emcmake cmake --preset wasm-release
          cmake --build build/wasm -j

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Cache haxe-wasm dist
        id: haxe-wasm-cache
        uses: actions/cache@v4
        with:
          path: haxe-wasm/dist
          key: haxe-wasm-${{ hashFiles('haxe-wasm/Dockerfile', 'haxe-wasm/build.sh', 'haxe-wasm/patches/**', 'haxe-wasm/harness/patch_env.mjs') }}

      - name: Build haxe-wasm (docker, cache miss only)
        if: steps.haxe-wasm-cache.outputs.cache-hit != 'true'
        run: bash haxe-wasm/build.sh

      # gen-api (npm run build に含まれる) が PATH の haxe を呼ぶ。
      # 同梱 haxelib は neko 製バイナリなので libneko (neko パッケージ) が要る。
      - name: Install Haxe 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends neko
          scripts/install-haxe5.sh "$HOME/haxe5"
          echo "$HOME/haxe5" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci (postinstall が slang-wasm を fetch)
        working-directory: web
        run: npm ci

      - name: Generate tcs wasm assets
        working-directory: web
        run: npm run gen-tcs -- --publish

      - name: Generate tcs prebuilt snapshots
        working-directory: web
        run: npm run gen-tcs-prebuilt

      - name: Generate haxe wasm assets
        working-directory: web
        run: npm run gen-haxe

      # verify が使う __lubTest hook (editor.ts) は dev/test mode 限定で
      # production build には入らない。verify は test mode build に対して行い、
      # deploy する production build は verify 後に作り直す。
      - name: Build site (test mode for verify)
        working-directory: web
        run: |
          npm run gen-api
          npx vite build --mode test

      - name: Install chromium (verify)
        working-directory: web
        run: npx playwright install --with-deps chromium

      # dist を vite preview で配信し、deploy 前の実体を verify する。
      - name: Verify headless (playwright + swiftshader)
        working-directory: web
        run: |
          npm run preview -- --port 4173 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ >/dev/null && break
            sleep 1
          done
          LUB_URL=http://localhost:4173/ npm run verify

      - name: Upload verify screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-screenshots
          path: /tmp/lub-verify
          if-no-files-found: ignore

      - name: Build site (production)
        working-directory: web
        run: npm run build

      - name: Deploy (wrangler)
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
