# PR のマージ gate と master deploy を 1 workflow に統合した CI。
# required check は gate job だけ: test job の増減やシャード数の変更で branch protection を触らずに済む。
#
# 変更検知 (changes job) は保守的な 2 クラスだけ切る:
#   - docs のみ (docs/** の manual 以外, *.md, .claude/**, LICENSE) → lint のみ
#   - web サブツリーのみ (web/, docs/manual/) → native をスキップ
# それ以外は全 job 実行。
# tcs/ の中のテスト (tcs-* の job) は、PR では tcs/ かこの workflow を変えたときだけ走る。
# 依存の閉包が広い (src/ は wasm へ、cs-lib/ は全 golden へ波及する) ので、細かく削るより漏れない側に倒す。
#
# cache は入力の内容で key を取り、入力が同じなら同じ物を使う:
#   - 第三者の library (SDL、Box2D、Box3D、OpenXR の loader) の install 先 <build>/deps/ (scripts/deps-cache-key.sh、cmake/LubDeps.cmake)
#   - tcs wasm assets (content key: tcs/ の tree の hash)
#   - slang prebuilt、emsdk、playwright browsers、npm
# lub 本体は毎回 build する (compile の cache は使わない)。
# master push が cache を作り、PR はそれを読む (actions/cache の branch scope)。
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# PR は ref ごとに group を分け、同一 PR への連続 push は前の run を止める。
# deploy 系 (master push / dispatch) は直列 (cancel しない)。
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      web_only: ${{ steps.classify.outputs.web_only }}
      tcs: ${{ steps.classify.outputs.tcs }}
    steps:
      - name: Classify changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docs_only=false
          web_only=false
          # tcs/ の中のテスト (tcs-* の job) を走らせるか。PR では tcs/ か この workflow を変えたときだけ
          tcs=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
              --paginate --jq '.[].filename' > /tmp/changed.txt
            docs_only=true
            web_only=true
            tcs=false
            while IFS= read -r f; do
              case "$f" in
                tcs/* | .github/workflows/ci.yml) tcs=true ;;
              esac
              case "$f" in
                docs/manual/*) docs_only=false ;; # サイトの docs.html に焼き込まれる
                docs/* | *.md | .claude/* | LICENSE) continue ;;
                *) docs_only=false ;;
              esac
              case "$f" in
                docs/manual/* | web/*) ;;
                *) web_only=false ;;
              esac
            done < /tmp/changed.txt
            if [ ! -s /tmp/changed.txt ]; then
              docs_only=false
              web_only=false
              tcs=true
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "web_only=$web_only" >> "$GITHUB_OUTPUT"
          echo "tcs=$tcs" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only web_only=$web_only tcs=$tcs"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Docs lint
        run: bash scripts/docs-lint.sh

      - name: WebXR input and scheduling
        run: node web/scripts/verify-xr.mjs

  # 整形の検査 (scripts/format.sh --check)。
  # clang-format は版で出力が変わるので pip で版を固定する。
  # prettier / stylua は web/package-lock.json の版。
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: tcs/global.json

      - name: Install clang-format
        run: pipx install clang-format==23.1.3

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: Format check
        run: bash scripts/format.sh --check

  # Linux regression gate: scripts/native-gate.sh (CI と手動 pre-push の単一ソース) で Release build -> C smoke tests -> C# runtime テスト -> サンプルの変換 -> 開発の道具の検査。
  # 視覚 golden の byte 比較は --skip-golden で外している: lavapipe の出力は mesa の version に依存し、runner の mesa はローカル生成の golden と一致しない。
  # CI の視覚 golden gate は windows job (WARP)、lavapipe golden はローカル pre-push の gate。
  # mesa を container 等で pin できたら有効化する。
  linux:
    needs: changes
    if: needs.changes.outputs.web_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # CMake configure が slang の prebuilt (~150MB) を落とすのでキャッシュする。
      # key は取得 URL を持つ CMakeLists.txt に紐付け。
      - name: Cache slang prebuilts
        uses: actions/cache@v4
        with:
          path: |
            third_party/slang/lib
            third_party/slang/bin
          key: slang-dxc-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Deps cache key
        id: deps
        run: bash scripts/deps-cache-key.sh linux >> "$GITHUB_OUTPUT"

      # 第三者の library の install 先。lub の configure は、key (cmake/LubDeps.cmake) が合わないときだけ作り直す
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: build-release-linux/deps
          key: ${{ steps.deps.outputs.key }}
          restore-keys: ${{ steps.deps.outputs.restore }}

      # SDL3 は vendored build なので X11/Wayland/audio の dev ヘッダが要る。
      # mesa-vulkan-drivers = lavapipe (CPU Vulkan)、xvfb = headless 窓。
      - name: Install system deps
        run: |
          # runner イメージ同梱の Google Chrome の apt source は metadata の Hash Sum mismatch を時々出して update ごと落とす。
          # ここでは使わない
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libvulkan-dev mesa-vulkan-drivers xvfb \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libdecor-0-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libudev-dev

      # tcs の変換と .NET 実行用。
      # native-gate.sh --require-cs が skip を fail 扱いにする。
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: tcs/global.json

      - name: Native gate (build, smokes, C# runtime tests, C# samples, dev tools)
        run: |
          export TMPDIR="${RUNNER_TEMP}/native-gate-tmp"
          mkdir -p "$TMPDIR"
          bash scripts/native-gate.sh --require-cs --skip-golden

      # web-export が page を書くのに使う lub と、その共有 library、テストの bytecode。
      # 共有 library は RUNPATH (build の絶対 path) で探すので、同じ path に置き戻す。
      - name: Upload lub for web-export
        uses: actions/upload-artifact@v4
        with:
          name: lub-linux
          path: |
            build-release-linux/lub
            build-release-linux/deps/lib/libSDL3.so.0
            build-release-linux/deps/lib/libopenxr_loader.so.1
            tests/cs/.lub/all.tcsb

      - name: Upload golden failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failure-linux
          path: ${{ runner.temp }}/native-gate-tmp
          if-no-files-found: ignore

  # Windows regression gate: build -> C smoke tests -> WARP golden。
  # WARP はソフトウェアラスタライザなので GPU の無い runner でも tests/golden/*_d3d12.png と byte 一致する。
  # vulkan backend は runner に Vulkan driver が無いためビルドのみ検証 (動作は linux job の lavapipe が同じ backend_vulkan.c で runtime テストを通す)。
  windows:
    needs: changes
    if: needs.changes.outputs.web_only != 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1

      # backend_vulkan.c のビルドに Vulkan headers + loader (vulkan-1.lib) が要る。
      # runner に Vulkan SDK は無いので Khronos リポジトリから該当コンポーネントだけ組み立てる (VULKAN_SDK env を設定し find_package(Vulkan) が拾う)。
      - name: Install Vulkan SDK components (headers + loader)
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      # CMake configure が slang / dxc の prebuilt (~150MB) を落とすので third_party/slang をキャッシュする。
      # key は取得 URL を持つ CMakeLists.txt に紐付け。
      - name: Cache slang + dxc prebuilts
        uses: actions/cache@v4
        with:
          path: |
            third_party/slang/lib
            third_party/slang/bin
            third_party/d3d12agility
            third_party/d3d12warp
          key: slang-dxc-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Deps cache key
        id: deps
        shell: bash
        run: bash scripts/deps-cache-key.sh windows >> "$GITHUB_OUTPUT"

      # 第三者の library の install 先。lub の configure は、key (cmake/LubDeps.cmake) が合わないときだけ作り直す
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: build-release/deps
          key: ${{ steps.deps.outputs.key }}
          restore-keys: ${{ steps.deps.outputs.restore }}

      - name: Configure
        run: cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-release

      # tests/cs の runtime テストとサンプルの C# は起動前に tcs vm で bytecode にするので dotnet が要る。
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: tcs/global.json

      # 後の step (golden の test と 00_hello の変換) も同じ Transpiler.dll を使う (repo root からの相対 path)
      - name: Build tests/cs (tcs VM bytecode)
        shell: bash
        run: |
          # msvc-dev-cmd が設定する Platform=x64 で既定の出力先が bin/x64/Release に変わるので、出力先を明示する。
          dotnet build tcs/Transpiler -c Release -nologo -v q -o build-tcs
          export LUB_TCS_DLL=build-tcs/Transpiler.dll
          test -f "$LUB_TCS_DLL"
          echo "LUB_TCS_DLL=$LUB_TCS_DLL" >> "$GITHUB_ENV"
          source scripts/cs-tests.sh
          cs_tests_vm_build

      - name: tcs process cleanup
        shell: bash
        run: LUB_BACKEND=d3d12 LUB_D3D12_WARP=1 scripts/test-tcs-process-cleanup.sh ./build-release/lub.exe

      # どの D3D12 runtime(Agility SDK か inbox か)と WARP が載ったか、backend が見る feature flag を log に残す。
      # WARP は runner の inbox 版を使う (golden はその出力で撮ってある。NuGet 版は LSB が違う)。
      - name: d3d12 runtime info
        shell: bash
        run: |
          ls -1 build-release/D3D12
          LUB_BACKEND=d3d12 LUB_D3D12_WARP=1 ./build-release/lub.exe tests/cs/.lub/all.tcsb --entry TestIndexedDraw \
            --capture "$RUNNER_TEMP/info.png" --capture-frame 1 --fixed-dt 0.0166666666666667 2>&1 \
            | grep -E '^d3d12:'

      # smoke test の exe は SDL3 (shared) にリンクしている。
      # SDL3.dll は build-release/deps/bin/ にあり、lub.exe 隣への copy は lub の POST_BUILD 頼み。
      # smoke exe と同じ dir に無いと loader が解決できず git-bash では起動前に落ちて exit 127 になるため、ここで明示的に staging。
      - name: Stage runtime DLLs next to smoke tests
        shell: bash
        run: |
          cd build-release
          echo "== *.dll in build-release (before) =="; ls -1 *.dll 2>/dev/null || echo "(none)"
          if [ ! -f SDL3.dll ]; then
            dll=$(find . -name SDL3.dll | head -1)
            echo "SDL3.dll not at root; found at: ${dll:-<none>}"
            [ -n "$dll" ] && cp "$dll" .
          fi
          echo "== *.dll in build-release (after) =="; ls -1 *.dll 2>/dev/null || echo "(none)"

      - name: C smoke tests
        shell: bash
        run: |
          cd build-release
          ./lub_shader_d3d12_smoke.exe
          ./lub_shader_layout_smoke.exe
          ./lub_sdf_smoke.exe
          ./lub_surfacenets_smoke.exe
          ./lub_physics_box2d_smoke.exe
          ./lub_physics_box3d_smoke.exe

      # Windows の tcs の子プロセス (CreateProcess と Job Object) と標準出力の frame の切り出しは、native-gate の linux とは別に見る。
      - name: tcs pipeline smoke
        shell: bash
        run: scripts/test-tcs-pipeline-smoke.sh ./build-release/lub_tcs_pipeline_smoke.exe

      # --readback-fixed-latency を付けない起動でも、readback の届く frame が他の backend と同じで、保証しないモードでは GPU を待たないこと (下の loop は付けて走らせる)。
      - name: Readback latency
        shell: bash
        run: |
          LUB_BACKEND=d3d12 LUB_D3D12_WARP=1 ./build-release/lub.exe tests/cs/.lub/all.tcsb --entry TestReadbackFixedLatency
          LUB_BACKEND=d3d12 LUB_D3D12_WARP=1 ./build-release/lub.exe tests/cs/.lub/all.tcsb --entry TestReadbackNoWait

      # pipeline、root signature、descriptor table を設定し直さずに使い回しても、各 draw が自分の状態で描くこと。
      # root signature を変えた後に設定し忘れた table は debug layer の error で見つける。
      - name: Draw state reuse (debug layer)
        shell: bash
        run: |
          log="${RUNNER_TEMP}/draw_state_reuse.log"
          LUB_BACKEND=d3d12 LUB_D3D12_WARP=1 LUB_D3D12_DEBUG=1 ./build-release/lub.exe tests/cs/.lub/all.tcsb --entry TestDrawStateReuse --readback-fixed-latency 2>&1 | tee "$log"
          if grep -E 'd3d12\[[^]]*\] (CORRUPTION|ERROR):' "$log"; then
            echo "::error::the D3D12 debug layer reported errors"
            exit 1
          fi

      # runtime テストは linux job では sdlgpu で走るので、d3d12 でも全部を debug layer 付きで走らせ、validation の error でも落とす。
      - name: Runtime tests (d3d12, debug layer)
        shell: bash
        run: |
          source scripts/cs-tests.sh
          failed=()
          for t in "${cs_runtime_tests[@]}"; do
            log="${RUNNER_TEMP}/runtime_$t.log"
            if ! LUB_BACKEND=d3d12 LUB_D3D12_WARP=1 LUB_D3D12_DEBUG=1 ./build-release/lub.exe tests/cs/.lub/all.tcsb --entry "$t" "${cs_test_args[@]}" >"$log" 2>&1; then
              echo "::error::$t failed"
              cat "$log"
              failed+=("$t")
            elif grep -E 'd3d12\[[^]]*\] (CORRUPTION|ERROR):' "$log"; then
              echo "::error::$t: the D3D12 debug layer reported errors"
              failed+=("$t")
            fi
          done
          # debug layer が読み込めないと、error を報告しないまま通る
          if ! grep -q 'd3d12: debug layer messages: on' "${RUNNER_TEMP}/runtime_TestManyDraws.log"; then
            echo "::error::the D3D12 debug layer did not load"
            failed+=(debug-layer)
          fi
          # pass ごとの GPU の時間を timestamp query で測れること (Sys.TakeGpuPasses)
          if ! grep -q 'gpu pass time: timed' "${RUNNER_TEMP}/runtime_TestGpuPassTime.log"; then
            echo "::error::d3d12 did not time the GPU passes"
            failed+=(TestGpuPassTime)
          fi
          [ ${#failed[@]} -eq 0 ]

      # lub export windows は shader を d3d12 (DXIL) と vulkan / sdlgpu (spirv) の両方の target で compile する。
      # snapshot の中で起動した d3d12 (WARP) の絵が、リポジトリから動かしたものと一致すること。
      - name: Export (windows)
        shell: bash
        run: |
          out="$RUNNER_TEMP/export"
          lub="$PWD/build-release/lub.exe"
          capture=(--capture-frame 5 --fixed-dt 0.0166666666666667)
          # snapshot の bytecode は <Entry>.tcsb
          for t in TestVertexPull TestDepthSample; do
            "$lub" export windows tests/cs/.lub/all.tcsb --entry "$t" -o "$out/$t"
            LUB_BACKEND=d3d12 LUB_D3D12_WARP=1 "$lub" tests/cs/.lub/all.tcsb --entry "$t" \
              --capture "$out/$t-repo.png" "${capture[@]}"
            (cd "$out/$t" && LUB_BACKEND=d3d12 LUB_D3D12_WARP=1 "$lub" "$t.tcsb" \
              --capture "$out/$t-snapshot.png" "${capture[@]}")
            cmp "$out/$t-repo.png" "$out/$t-snapshot.png"
          done
          # shader 1 つにつき target 2 つ (TestVertexPull は 1 つ、TestDepthSample は 2 つ)
          test "$(ls "$out/TestVertexPull/cache/shader" | wc -l)" -eq 2
          test "$(ls "$out/TestDepthSample/cache/shader" | wc -l)" -eq 4

      - name: Golden image test (d3d12 backend, WARP)
        shell: bash
        run: |
          export TMPDIR="${RUNNER_TEMP}/golden-tmp"
          mkdir -p "$TMPDIR"
          scripts/run-golden.sh

      # .NET 実行: 共有 library (lub.dll、cmake --build が作る) を facade から P/Invoke で叩き、tcs VM の player と frame digest が一致することを 1 サンプルで確かめる (capture の比較は手元の native gate だけ)。
      - name: .NET run (00_hello, digest vs tcs VM)
        shell: bash
        run: |
          export LUB_D3D12_WARP=1
          export LUB_NATIVE_LIB="$(cygpath -m "$PWD/build-release/lub.dll")"
          scripts/run-cs-sample.sh 00_hello --vm
          ./build-release/lub.exe samples/00_hello/.lub/Hello00.tcsb --entry Hello00 --capture "$RUNNER_TEMP/cs.png" --capture-frame 30 --fixed-dt 0.0166666666666667 --digest | grep '^digest ' > "$RUNNER_TEMP/cs.digest"
          dotnet build dotnet/SampleRunner -p:Sample=00_hello -nologo -v q
          # 落ちたときは、何が起きたかを見るために出力を全部出す
          ./dotnet/SampleRunner/bin/00_hello/lub-sample-00_hello.exe --capture "$RUNNER_TEMP/dn.png" --capture-frame 30 --fixed-dt 0.0166666666666667 --digest > "$RUNNER_TEMP/dn.log" 2>&1 || { cat "$RUNNER_TEMP/dn.log"; exit 1; }
          grep -E '^d3d12:' "$RUNNER_TEMP/dn.log" || true
          grep '^digest ' "$RUNNER_TEMP/dn.log" > "$RUNNER_TEMP/dn.digest" || { cat "$RUNNER_TEMP/dn.log"; exit 1; }
          cmp "$RUNNER_TEMP/cs.digest" "$RUNNER_TEMP/dn.digest"

      - name: Upload golden failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failure-windows
          path: ${{ runner.temp }}/golden-tmp
          if-no-files-found: ignore

  # macOS regression gate: scripts/apple-gate.sh --part mac (CI と手動の単一ソース) で Release build -> C smoke tests -> C# runtime テスト -> 視覚 golden -> shader cache の往復。
  # Metal は runner の GPU で描くので byte 一致にはならず、golden は Linux の *_sdlgpu.png との許容差比較 (scripts/png-diff.py)。
  # iOS 側 (--part ios、simulator での実行) は release.yml で走る。
  macos:
    needs: changes
    if: needs.changes.outputs.web_only != 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # CMake configure が slang の prebuilt を落とすのでキャッシュする。
      - name: Cache slang prebuilts
        uses: actions/cache@v4
        with:
          path: third_party/slang/lib
          key: slang-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Deps cache key
        id: deps
        run: bash scripts/deps-cache-key.sh macos >> "$GITHUB_OUTPUT"

      # 第三者の library の install 先。lub の configure は、key (cmake/LubDeps.cmake) が合わないときだけ作り直す。
      # slang を持たない player (build-mac-player) も同じ物を使う。
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            build-mac/deps
            build-mac-player/deps
          key: ${{ steps.deps.outputs.key }}
          restore-keys: ${{ steps.deps.outputs.restore }}

      # run-golden.sh は bash 4+ (mapfile / wait -n)。
      # macOS 同梱の bash は 3.2。
      - name: Install tools
        run: brew install bash ninja

      # tests/cs の test とサンプルの C# は起動前に tcs で transpile するので dotnet が要る。
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: tcs/global.json

      - name: Apple gate, macOS part (build, smokes, C# runtime tests, golden, shader cache)
        run: |
          export TMPDIR="${RUNNER_TEMP}/apple-gate-tmp"
          mkdir -p "$TMPDIR"
          bash scripts/apple-gate.sh --part mac

      - name: Upload golden failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failure-macos
          path: ${{ runner.temp }}/apple-gate-tmp
          if-no-files-found: ignore

  # web のサイト (lub.neguse.net) のアセット生成 + build。
  # 検証は下流の web-verify と web-export が artifact (web-dist-test) に対して行う。
  # 前提アセット (web/README.md) の供給:
  #   - lub player wasm: emsdk でこの job 内でビルド
  #   - tcs WasmCompiler: content key cache、miss 時だけ dotnet で publish
  web-build:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EMSDK_VERSION: 5.0.2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve tcs tree hash (cache key)
        id: tcs
        run: echo "sha=$(git rev-parse HEAD:tcs)" >> "$GITHUB_OUTPUT"

      # emsdk は固定パス (~/emsdk) に置く。
      # setup-emsdk action は毎 run ランダムな temp パスに展開するので、compiler の path が変わり、deps の key (cmake/LubDeps.cmake) が合わなくなる。
      - name: Cache emsdk
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}
      - name: Install emsdk
        run: |
          if [ ! -x "$HOME/emsdk/emsdk" ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk "$HOME/emsdk"
          fi
          "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: Deps cache key
        id: deps
        run: bash scripts/deps-cache-key.sh "wasm-emsdk-$EMSDK_VERSION" >> "$GITHUB_OUTPUT"

      # 第三者の library の install 先。lub の configure は、key (cmake/LubDeps.cmake) が合わないときだけ作り直す。
      # tcs2c の web の player (build/wasm-tcs) も同じ物を使う。
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            build/wasm/deps
            build/wasm-tcs/deps
          key: ${{ steps.deps.outputs.key }}
          restore-keys: ${{ steps.deps.outputs.restore }}

      - name: Build lub player wasm
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          emcmake cmake --preset wasm-release
          cmake --build build/wasm -j
          # 外の project が find_package(lub) で自前の player を作れること
          emcmake cmake -S tests/cmake/player -B build/wasm/export-player -G Ninja -Dlub_DIR="$PWD/build/wasm"
          cmake --build build/wasm/export-player

      # lider の page (web/lider.html) の player。lub の wasm の build を find_package(lub) で使い、かな漢字変換 (Rust) を静的に link する。
      - name: Build lider player wasm
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          rustup target add wasm32-unknown-emscripten
          bash lider/scripts/build-player.sh --web

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci (postinstall が slang-wasm を fetch)
        working-directory: web
        run: npm ci

      # tcs wasm assets は入力が tcs/ だけなので content key で cache し、触らない PR では dotnet workload ごとスキップする。
      - name: Cache tcs wasm assets
        id: tcs-wasm-cache
        uses: actions/cache@v4
        with:
          path: web/tcs-wasm-assets
          key: tcs-wasm-${{ steps.tcs.outputs.sha }}-${{ hashFiles('web/scripts/gen-tcs-assets.mjs') }}

      # tcs2c の web の player (下の Build tcs2c web player) にも使うので、cache が当たっても入れる。
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: tcs/global.json

      # workload は SDK の版ごとに入る。tcs の global.json が選ぶ SDK に入れるために tcs の中で動かす。
      - name: Install wasm-tools workload
        if: steps.tcs-wasm-cache.outputs.cache-hit != 'true'
        working-directory: tcs
        run: dotnet workload install wasm-tools

      - name: Generate tcs wasm assets
        if: steps.tcs-wasm-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npm run gen-tcs -- --publish

      # src/tcs_host.c の web の player (tests/c/tcs_shutdown.cs)。
      # web-export の job が page で開き、page が player を外す順番を見る。
      - name: Build tcs2c web player
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          bash scripts/web-tcs-host-build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: web-tcs-player
          path: |
            build/wasm-tcs/lub.js
            build/wasm-tcs/lub.wasm

      - name: Build site (test mode for verify)
        working-directory: web
        run: |
          npm run gen-api
          npm run gen-lider
          npx vite build --mode test

      # web の dist は同じ run の後続 job への受け渡し専用で、run の後は使わない。
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-test
          path: web/dist
          retention-days: 1

      - name: Build site (production)
        if: github.event_name != 'pull_request'
        working-directory: web
        run: npm run build

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: web-dist-prod
          path: web/dist
          retention-days: 1

  # dist を vite preview で配信し、deploy 前の実体を headless で検証する。
  # shard 1 = player の page (tests/cs)、shard 2 = サイトの入口。
  # verify は閾値判定なので runner の system chromium で足りる。
  web-verify:
    needs: [changes, web-build]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      # player の page の検査 (shard 1) は tests/cs の test を native の tcs で変換した bytecode を流す。
      - uses: actions/setup-dotnet@v4
        if: matrix.shard == 1
        with:
          global-json-file: tcs/global.json

      - name: Build tests/cs bytecode
        if: matrix.shard == 1
        shell: bash
        run: |
          dotnet build tcs/Transpiler -c Release -nologo -v q
          export LUB_TCS_DLL="$(find tcs/Transpiler/bin/Release -name Transpiler.dll -print -quit)"
          source scripts/cs-tests.sh
          cs_tests_vm_build

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: web-dist-test
          path: web/dist

      # tests/cs の runtime テストを web の player の page で動かす (verify-player の A9)。
      - name: Verify player page (shard 1)
        if: matrix.shard == 1
        working-directory: web
        run: |
          npm run preview -- --port 4173 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ >/dev/null && break
            sleep 1
          done
          LUB_URL=http://localhost:4173/ npm run verify

      # サイトの入口 (lider): 起動、保存した編集の反映、診断、並べる表示、サンプル、メニューと Doc の page (verify-lider)。
      - name: Verify entry page (shard 2)
        if: matrix.shard == 2
        working-directory: web
        run: |
          npm run preview -- --port 4176 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4176/ >/dev/null && break
            sleep 1
          done
          LUB_URL=http://localhost:4176/ npm run verify-lider

      - name: Upload verify screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-screenshots-${{ matrix.shard }}
          path: /tmp/lub-verify
          if-no-files-found: ignore

  # lub export web が書いた page 1 枚 (slang を持たない web の player と生成キャッシュ入り) を chromium で開き、tests/cs のテストが PASS を出すこと。
  # export は linux の job が build した lub、player は web-build の wasm を使う。
  # web-build が作った tcs2c の player を page から外す順番もここで見る (chromium があるので)。
  web-export:
    needs: [changes, linux, web-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore slang prebuilts
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party/slang/lib
            third_party/slang/bin
          key: slang-dxc-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          fail-on-cache-miss: true

      - uses: actions/download-artifact@v4
        with:
          name: lub-linux
          path: .

      - uses: actions/download-artifact@v4
        with:
          name: web-dist-test
          path: web/dist

      - uses: actions/download-artifact@v4
        with:
          name: web-tcs-player
          path: build/wasm-tcs

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: Cache playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      # playwright 1.60 は ubuntu 26.04 を知らず、そのままでは download の URL が無い。
      # 配っている chromium は ubuntu の版によらず同じなので 24.04 として取る (--with-deps は 26.04 の package を引けないので使わない)。
      - name: Install chromium (playwright) and the Vulkan loader lub links
        working-directory: web
        run: |
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=ubuntu24.04-x64 npx playwright install chromium
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1

      - name: Web export gate
        run: |
          chmod +x build-release-linux/lub
          mkdir -p build/wasm/vm
          cp web/dist/wasm/vm/lub.js web/dist/wasm/vm/lub.wasm build/wasm/vm/
          bash scripts/web-export-gate.sh build-release-linux/lub

      # page が tcs2c の player を外すとき (Module._lub_tcs_shutdown) に OnQuit が一度だけ動いて止まること。
      - name: tcs2c web player shutdown
        working-directory: web
        run: node scripts/tcs-shutdown-check.mjs ../build/wasm-tcs

  # 唯一の required check。
  # 走った job が全部 success (skipped は changes の判定による意図的な skip) なら green。
  # changes / lint は必ず走る前提。
  # ---- tcs/ の中のテスト ----
  # tcs (C# の compiler と VM) 自身のテスト。lub の job は tcs を使う側から確かめ、こちらは tcs の仕様から確かめる。
  # .NET SDK の版は tcs/global.json で固定する。
  tcs-test:
    needs: changes
    if: needs.changes.outputs.tcs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tcs
    steps:
      - uses: actions/checkout@v4

      # spec conformance の入力 (C# の仕様の例)
      - name: Init csharpstandard
        working-directory: .
        run: git submodule update --init tcs/deps/csharpstandard

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: tcs/global.json

      - name: Run tests and tcs checks
        run: bash run-tests.sh

  # tcs 自身の速さの回帰 (tcs/perf/selfbench)。PR の base と同じ runner で測り、決定的な指標 (命令の数、managed heap の最大) が閾値を超えて増えたら失敗する。
  # 測るのは C の tcs の tcs vm (lider の player が page の中でゲームを変換するのと同じ経路) だけで、時間は測らない。
  tcs-selfbench:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.tcs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tcs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: tcs/global.json

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Compare with the PR base
        run: python3 perf/selfbench/run.py --base "origin/$BASE_REF" --tasks vm --hosts native --runs 0 -o selfbench.json
        env:
          BASE_REF: ${{ github.base_ref }}

      - name: Upload selfbench results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcs-selfbench-results
          path: tcs/selfbench.json

  # tcs2c で C にした tcs (tcs/SelfHost/native.sh) を 3 OS で作り、.NET の tcs と同じ出力を出すことを確かめる。
  tcs-native:
    needs: changes
    if: needs.changes.outputs.tcs == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: cc
          - os: macos-latest
            cc: clang
          - os: windows-latest
            cc: clang
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: tcs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: tcs/global.json

      - name: Build native tcs and compare with .NET
        run: bash SelfHost/native.sh
        env:
          CC: ${{ matrix.cc }}

  gate:
    needs: [changes, lint, format, linux, windows, macos, web-build, web-verify, web-export, tcs-test, tcs-selfbench, tcs-native]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          bad=$(echo "$NEEDS" | jq -r 'to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | .key')
          if [ -n "$bad" ]; then
            echo "failed jobs: $bad" >&2
            exit 1
          fi
          for must in changes lint format; do
            if [ "$(echo "$NEEDS" | jq -r --arg j "$must" '.[$j].result')" != "success" ]; then
              echo "$must did not succeed" >&2
              exit 1
            fi
          done

  # master push / workflow_dispatch のみ。
  # verify 済み artifact とは別に production build (web-dist-prod) を deploy する。
  # local の `cd web && npm run deploy` は脱出ハッチとして残す。
  # gate が待つ job に skipped (PR だけで走る job) があると、if に状態の関数が無い job は skipped になる。
  # gate の結果を自分で見る。
  deploy:
    needs: [gate]
    if: ${{ !cancelled() && needs.gate.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: web-dist-prod
          path: web/dist

      - name: Deploy (wrangler)
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
