# CI that combines the PR merge gate and the master deploy into one workflow.
# The only required check is the gate job: adding or removing test jobs or changing the shard count does not require touching branch protection.
# Jobs are not selected by changed paths; everything runs every time.
#
# Caches are keyed by the content of their inputs, and the same inputs reuse the same entry:
#   - Install directory of third-party libraries (SDL, Box2D, Box3D, OpenXR loader) <build>/deps/ (scripts/deps-cache-key.sh, cmake/LubDeps.cmake)
#   - tcs wasm assets (content key: hash of the tcs/ tree)
#   - slang prebuilt, emsdk, playwright browsers, npm
# lub's own source changes with every PR, so compiles are cached with ccache (Linux, macOS, Windows, web).
# master pushes create the cache and PRs read it (actions/cache branch scope).
# Linux jobs pin the runner image to ubuntu-26.04. ubuntu-latest has periods where versions are mixed, and a different compiler rebuilds deps and misses ccache entirely.
# Only the release bundle (kit) is built on ubuntu-24.04 so that it runs on environments with an older glibc.
# ccache is not saved on PRs (saving per PR would keep growing the cache). A workflow_dispatch run on a branch saves into that branch's scope.
name: ci

on:
  push:
    branches: [master]
    # A tag (v*) push publishes the checked release bundle to the GitHub release (publish job)
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# PRs are grouped per ref, and consecutive pushes to the same PR cancel the previous run.
# master runs (which deploy) are serialized and never cancelled. Tag and other branch runs use per-ref groups and do not wait for master runs.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && 'deploy' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Docs lint
        run: bash scripts/docs-lint.sh

      - name: WebXR input and scheduling
        run: node web/scripts/verify-xr.mjs

  # Format check (scripts/format.sh --check).
  # clang-format output changes between versions, so its version is pinned via pip.
  # prettier uses the version in web/package-lock.json.
  format:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install clang-format
        run: pipx install clang-format==23.1.3

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: Format check
        run: bash scripts/format.sh --check

  # Linux regression gate: scripts/native-gate.sh (the single source for CI and manual pre-push) runs Release build -> C smoke tests -> C# runtime tests -> sample conversion -> development tool checks.
  # Byte comparison of visual goldens is disabled with --skip-golden: lavapipe output depends on the mesa version, and the runner's mesa does not match the locally generated goldens.
  # The CI visual golden gate is the windows job (WARP); the lavapipe golden is the local pre-push gate.
  # Enable it once mesa can be pinned (e.g. with a container).
  # The native gate is split into per-part (--part) jobs that run in parallel. lider runtime tests are split in two (LIDER_SHARD).
  linux:
    name: linux (${{ matrix.part }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: bindings
          - part: runtime
          - part: tools
          - part: lider
            shard: 1/4
          - part: lider
            shard: 2/4
          - part: lider
            shard: 3/4
          - part: lider
            shard: 4/4
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      CCACHE_MAXSIZE: 500M
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4

      # Fetch only the needed submodules, in parallel
      - name: Submodules
        shell: bash
        run: git submodule update --init --depth 1 --jobs 8 third_party/SDL third_party/box2d third_party/box3d third_party/openxr third_party/jamo

      # CMake configure downloads the slang prebuilt (~150MB), so it is cached.
      # The key is tied to CMakeLists.txt, which holds the download URL.
      - name: Cache slang prebuilts
        uses: actions/cache@v4
        with:
          path: |
            third_party/slang/lib
            third_party/slang/bin
          key: slang-dxc-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Deps cache key
        id: deps
        run: bash scripts/deps-cache-key.sh linux >> "$GITHUB_OUTPUT"

      # Install directory of third-party libraries. lub's configure rebuilds them only when the key (cmake/LubDeps.cmake) does not match
      - name: Cache deps
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: build-release-linux/deps
          key: ${{ steps.deps.outputs.key }}
          restore-keys: ${{ steps.deps.outputs.restore }}

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      # mesa-vulkan-drivers = lavapipe (CPU Vulkan), xvfb = headless window.
      # Only when building SDL3 (when the deps cache misses on the key), install the X11/Wayland/audio dev headers that the SDL3 build needs.
      - name: Install system deps
        uses: ./.github/actions/apt-install
        with:
          packages: ninja-build libvulkan-dev mesa-vulkan-drivers xvfb ${{ steps.deps-cache.outputs.cache-hit != 'true' && 'libasound2-dev libpulse-dev libpipewire-0.3-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libdecor-0-dev libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev libudev-dev' || '' }}

      # Pinned-version ccache (scripts/install-ccache.sh)
      - name: Install ccache
        shell: bash
        run: bash scripts/install-ccache.sh

      # For tcs conversion and .NET execution.
      # native-gate.sh --require-cs treats a skip as a failure.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Kana-kanji conversion dictionary (used by lider's tests/ime and tests/editor/ime). Its inputs are build-dict.sh (which fixes the mozc commit to fetch) and the jamo commit, so they are the cache key, and the dictionary is built only when missing
      - name: Dictionary key
        if: matrix.part == 'lider'
        id: dict
        run: echo "key=mozc-dict-$(git rev-parse HEAD:third_party/jamo)-${{ hashFiles('lider/scripts/build-dict.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Cache the dictionary
        if: matrix.part == 'lider'
        id: dict-cache
        uses: actions/cache@v4
        with:
          path: |
            lider/data/mozc.dict
            lider/data/mozc-README.txt
            lider/data/mozc-LICENSE.txt
          key: ${{ steps.dict.outputs.key }}

      # tests/ime skips when the dictionary is missing, so check here that it exists
      - name: Dictionary
        if: matrix.part == 'lider'
        run: |
          if [ "${{ steps.dict-cache.outputs.cache-hit }}" != true ]; then
            bash lider/scripts/build-dict.sh lider/data
          fi
          test -s lider/data/mozc.dict

      # Prebuilt kana-kanji conversion (jamo-core, Rust). Its inputs are the jamo commit and the rustc version, and on a hit cargo does not run (JAMO_CACHE in lider/scripts/build-player.sh)
      - name: jamo cache key
        if: matrix.part == 'lider'
        id: jamo
        run: echo "key=jamo-lib-linux-$(git rev-parse HEAD:third_party/jamo)-$(rustc -V | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

      - name: Cache jamo
        if: matrix.part == 'lider'
        uses: actions/cache@v4
        with:
          path: build-jamo
          key: ${{ steps.jamo.outputs.key }}

      - name: Native gate (${{ matrix.part }})
        env:
          LIDER_SHARD: ${{ matrix.shard }}
          JAMO_CACHE: ${{ github.workspace }}/build-jamo
        run: |
          export TMPDIR="${RUNNER_TEMP}/native-gate-tmp"
          mkdir -p "$TMPDIR"
          bash scripts/native-gate.sh --require-cs --skip-golden --part ${{ matrix.part }}

      - name: ccache stats
        if: always()
        run: ccache -s

      # Of the parts, runtime saves it because it builds the most
      - name: Save ccache
        if: github.event_name != 'pull_request' && matrix.part == 'runtime'
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-linux-${{ github.sha }}

      # The lub that web-export uses to write pages, its shared libraries, and the test bytecode.
      # The shared libraries are found via RUNPATH (absolute build path), so put them back at the same path.
      - name: Upload lub for web-export
        if: matrix.part == 'runtime'
        uses: actions/upload-artifact@v4
        with:
          name: lub-linux
          path: |
            build-release-linux/lub
            build-release-linux/deps/lib/libSDL3.so.0
            build-release-linux/deps/lib/libopenxr_loader.so.1
            tests/cs/.lub/all.tcsb

      - name: Upload golden failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-gate-failure-${{ strategy.job-index }}
          path: ${{ runner.temp }}/native-gate-tmp
          if-no-files-found: ignore

  # Windows regression gate: build -> C smoke tests -> WARP golden.
  # WARP is a software rasterizer, so it matches tests/golden/*_d3d12.png byte for byte even on runners without a GPU.
  # The vulkan backend is only build-verified because the runner has no Vulkan driver (for behavior, the linux job runs the runtime tests on lavapipe with the same backend_vulkan.c).
  windows:
    name: windows (${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        # The post-build checks are split into 2 jobs that run in parallel. checks = individual checks and export, runtime = tests/cs runtime tests, golden, and .NET execution
        part: [checks, runtime]
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CCACHE_MAXSIZE: 500M
      # The .NET SDK version is not in the image and is fetched every time, so the install directory is fixed and cached
      DOTNET_INSTALL_DIR: C:\dotnet
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      # A freshly started runner takes about 20 seconds to run the compiler for the first time (the first compile in configure pays for it).
      # Run it once in the background during the later setup (submodules, cache restore)
      - name: Warm up the compilers
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/warm"
          cd "$RUNNER_TEMP/warm"
          printf 'int main(void) { return 0; }\n' > warm.c
          cp warm.c warm.cpp
          (
            cl /nologo warm.c /Fe:warm-c.exe
            cl /nologo warm.cpp /Fe:warm-cxx.exe
          ) > warm.log 2>&1 &

      # Fetch only the needed submodules, in parallel
      - name: Submodules
        shell: bash
        run: git submodule update --init --depth 1 --jobs 8 third_party/SDL third_party/box2d third_party/box3d third_party/openxr

      # Building backend_vulkan.c requires the Vulkan headers + loader (vulkan-1.lib).
      # The runner has no Vulkan SDK, so only the needed components are built from the Khronos repositories (VULKAN_SDK env is set so find_package(Vulkan) picks them up).
      - name: Install Vulkan SDK components (headers + loader)
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      # CMake configure downloads the slang / dxc prebuilt (~150MB), so third_party/slang is cached.
      # The key is tied to CMakeLists.txt, which holds the download URL.
      - name: Cache slang + dxc prebuilts
        uses: actions/cache@v4
        with:
          path: |
            third_party/slang/lib
            third_party/slang/bin
            third_party/d3d12agility
            third_party/d3d12warp
          key: slang-dxc-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Deps cache key
        id: deps
        shell: bash
        run: bash scripts/deps-cache-key.sh windows >> "$GITHUB_OUTPUT"

      # Install directory of third-party libraries. lub's configure rebuilds them only when the key (cmake/LubDeps.cmake) does not match
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: build-release/deps
          key: ${{ steps.deps.outputs.key }}
          restore-keys: ${{ steps.deps.outputs.restore }}

      # ccache also handles MSVC's cl (Release has no debug info, so it can be cached as is).
      # Pinned-version ccache (scripts/install-ccache.sh)
      - name: Install ccache
        shell: bash
        run: bash scripts/install-ccache.sh

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-windows-${{ github.sha }}
          restore-keys: ccache-windows-

      - name: Cache .NET
        uses: actions/cache@v4
        with:
          path: C:\dotnet
          key: dotnet-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json') }}

      # The tests/cs runtime tests and the sample C# are compiled to bytecode with the tcs vm before launch, so dotnet is required.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Configure
        run: cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # The tests/cs bytecode (built by the .NET tcs) does not depend on the lub build, so it is built in parallel.
      # Later steps (the golden test and the 00_hello conversion) use the same Transpiler.dll (relative path from the repo root).
      # Platform=x64 set by msvc-dev-cmd changes dotnet's default output directory to bin/x64/Release, so the output directory is given explicitly.
      - name: Build (lub, and the tests/cs bytecode alongside)
        shell: bash
        run: |
          export LUB_TCS_DLL=build-tcs/Transpiler.dll
          echo "LUB_TCS_DLL=$LUB_TCS_DLL" >> "$GITHUB_ENV"
          (
            dotnet build tcs/Transpiler -c Release -nologo -v q -o build-tcs
            test -f "$LUB_TCS_DLL"
            source scripts/cs-tests.sh
            cs_tests_vm_build
          ) > "$RUNNER_TEMP/tests-cs.log" 2>&1 &
          bytecode=$!
          cmake --build build-release
          wait "$bytecode" || {
            cat "$RUNNER_TEMP/tests-cs.log"
            exit 1
          }

      - name: ccache stats
        run: ccache -s

      - name: Save ccache
        if: github.event_name != 'pull_request' && matrix.part == 'checks'
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-windows-${{ github.sha }}

      - name: tcs process cleanup
        if: matrix.part == 'checks'
        shell: bash
        run: LUB_BACKEND=d3d12 LUB_D3D12_WARP=1 scripts/test-tcs-process-cleanup.sh ./build-release/lub.exe

      # Log which D3D12 runtime (Agility SDK or inbox) and WARP were loaded, and the feature flags the backend sees.
      # WARP uses the runner's inbox version (the goldens were captured with its output; the NuGet version differs in the LSB).
      - name: d3d12 runtime info
        if: matrix.part == 'checks'
        shell: bash
        run: |
          ls -1 build-release/D3D12
          LUB_BACKEND=d3d12 LUB_D3D12_WARP=1 ./build-release/lub.exe tests/cs/.lub/all.tcsb --entry TestIndexedDraw \
            --capture "$RUNNER_TEMP/info.png" --capture-frame 1 --fixed-dt 0.0166666666666667 2>&1 \
            | grep -E '^d3d12:'

      # The smoke test exe links against SDL3 (shared).
      # SDL3.dll is in build-release/deps/bin/, and copying it next to lub.exe relies on lub's POST_BUILD.
      # If it is not in the same dir as the smoke exe, the loader cannot resolve it and under git-bash the exe crashes before starting with exit 127, so it is staged explicitly here.
      - name: Stage runtime DLLs next to smoke tests
        if: matrix.part == 'checks'
        shell: bash
        run: |
          cd build-release
          echo "== *.dll in build-release (before) =="; ls -1 *.dll 2>/dev/null || echo "(none)"
          if [ ! -f SDL3.dll ]; then
            dll=$(find . -name SDL3.dll | head -1)
            echo "SDL3.dll not at root; found at: ${dll:-<none>}"
            [ -n "$dll" ] && cp "$dll" .
          fi
          echo "== *.dll in build-release (after) =="; ls -1 *.dll 2>/dev/null || echo "(none)"

      - name: C smoke tests
        if: matrix.part == 'checks'
        shell: bash
        run: |
          cd build-release
          ./lub_shader_d3d12_smoke.exe
          ./lub_shader_layout_smoke.exe
          ./lub_sdf_smoke.exe
          ./lub_surfacenets_smoke.exe
          ./lub_physics_box2d_smoke.exe
          ./lub_physics_box3d_smoke.exe

      # Windows tcs child processes (CreateProcess and Job Object) and splitting frames out of stdout are checked separately from native-gate on linux.
      - name: tcs pipeline smoke
        if: matrix.part == 'checks'
        shell: bash
        run: scripts/test-tcs-pipeline-smoke.sh ./build-release/lub_tcs_pipeline_smoke.exe

      # Even when launched without --readback-fixed-latency, readback arrives on the same frame as on other backends, and in the non-guaranteeing mode it does not wait for the GPU (the loop below runs with the flag).
      - name: Readback latency
        if: matrix.part == 'checks'
        shell: bash
        run: |
          LUB_BACKEND=d3d12 LUB_D3D12_WARP=1 ./build-release/lub.exe tests/cs/.lub/all.tcsb --entry TestReadbackFixedLatency
          LUB_BACKEND=d3d12 LUB_D3D12_WARP=1 ./build-release/lub.exe tests/cs/.lub/all.tcsb --entry TestReadbackNoWait

      # Even when the pipeline, root signature, and descriptor tables are reused without being set again, each draw renders with its own state.
      # A table that is not set again after changing the root signature is caught by a debug layer error.
      - name: Draw state reuse (debug layer)
        if: matrix.part == 'checks'
        shell: bash
        run: |
          log="${RUNNER_TEMP}/draw_state_reuse.log"
          LUB_BACKEND=d3d12 LUB_D3D12_WARP=1 LUB_D3D12_DEBUG=1 ./build-release/lub.exe tests/cs/.lub/all.tcsb --entry TestDrawStateReuse --readback-fixed-latency 2>&1 | tee "$log"
          if grep -E 'd3d12\[[^]]*\] (CORRUPTION|ERROR):' "$log"; then
            echo "::error::the D3D12 debug layer reported errors"
            exit 1
          fi

      # Runtime tests run on sdlgpu and vulkan in the linux job and on metal in the macos job.
      # Here all of them run on d3d12 with the debug layer, and validation errors also fail.
      - name: Runtime tests (d3d12, debug layer)
        if: matrix.part == 'runtime'
        shell: bash
        run: |
          source scripts/cs-tests.sh
          # Fail on crashes and when the debug layer reports an error
          d3d12_test() {
            LUB_BACKEND=d3d12 LUB_D3D12_WARP=1 LUB_D3D12_DEBUG=1 ./build-release/lub.exe tests/cs/.lub/all.tcsb --entry "$1" "${cs_test_args[@]}" >"$2" 2>&1 || return 1
            ! grep -E 'd3d12\[[^]]*\] (CORRUPTION|ERROR):' "$2"
          }
          cs_test_logs="${RUNNER_TEMP}/runtime" && mkdir -p "$cs_test_logs"
          # WARP renders on the CPU, so run as many in parallel as there are cores
          status=0
          cs_run_tests "$(nproc)" d3d12_test "${cs_runtime_tests[@]}" || status=1
          # If the debug layer cannot be loaded, the run passes without reporting errors
          if ! grep -q 'd3d12: debug layer messages: on' "$cs_test_logs/TestManyDraws.log"; then
            echo "::error::the D3D12 debug layer did not load"
            status=1
          fi
          # GPU time per pass can be measured with timestamp queries (Sys.TakeGpuPasses)
          if ! grep -q 'gpu pass time: timed' "$cs_test_logs/TestGpuPassTime.log"; then
            echo "::error::d3d12 did not time the GPU passes"
            status=1
          fi
          exit "$status"

      # lub export windows compiles shaders for both the d3d12 (DXIL) and vulkan / sdlgpu (spirv) targets.
      # The d3d12 (WARP) image launched inside the snapshot matches the one run from the repository.
      - name: Export (windows)
        if: matrix.part == 'checks'
        shell: bash
        run: |
          out="$RUNNER_TEMP/export"
          lub="$PWD/build-release/lub.exe"
          capture=(--capture-frame 5 --fixed-dt 0.0166666666666667)
          # The snapshot bytecode is <Entry>.tcsb
          for t in TestVertexPull TestDepthSample; do
            "$lub" export windows tests/cs/.lub/all.tcsb --entry "$t" -o "$out/$t"
            LUB_BACKEND=d3d12 LUB_D3D12_WARP=1 "$lub" tests/cs/.lub/all.tcsb --entry "$t" \
              --capture "$out/$t-repo.png" "${capture[@]}"
            (cd "$out/$t" && LUB_BACKEND=d3d12 LUB_D3D12_WARP=1 "$lub" "$t.tcsb" \
              --capture "$out/$t-snapshot.png" "${capture[@]}")
            cmp "$out/$t-repo.png" "$out/$t-snapshot.png"
          done
          # 2 targets per shader (TestVertexPull has 1 shader, TestDepthSample has 2)
          test "$(ls "$out/TestVertexPull/cache/shader" | wc -l)" -eq 2
          test "$(ls "$out/TestDepthSample/cache/shader" | wc -l)" -eq 4

      - name: Golden image test (d3d12 backend, WARP)
        if: matrix.part == 'runtime'
        shell: bash
        run: |
          export TMPDIR="${RUNNER_TEMP}/golden-tmp"
          mkdir -p "$TMPDIR"
          scripts/run-golden.sh

      # .NET execution: call the shared library (lub.dll, built by cmake --build) via P/Invoke from the facade, and check with one sample that the frame digest matches the tcs VM player (capture comparison is only in the local native gate).
      - name: .NET run (00_hello, digest vs tcs VM)
        if: matrix.part == 'runtime'
        shell: bash
        run: |
          export LUB_D3D12_WARP=1
          export LUB_NATIVE_LIB="$(cygpath -m "$PWD/build-release/lub.dll")"
          scripts/run-cs-sample.sh 00_hello --vm
          ./build-release/lub.exe samples/00_hello/.lub/Hello00.tcsb --entry Hello00 --capture "$RUNNER_TEMP/cs.png" --capture-frame 30 --fixed-dt 0.0166666666666667 --digest | grep '^digest ' > "$RUNNER_TEMP/cs.digest"
          dotnet build dotnet/SampleRunner -p:Sample=00_hello -nologo -v q
          # On failure, print all output to see what happened
          ./dotnet/SampleRunner/bin/00_hello/lub-sample-00_hello.exe --capture "$RUNNER_TEMP/dn.png" --capture-frame 30 --fixed-dt 0.0166666666666667 --digest > "$RUNNER_TEMP/dn.log" 2>&1 || { cat "$RUNNER_TEMP/dn.log"; exit 1; }
          grep -E '^d3d12:' "$RUNNER_TEMP/dn.log" || true
          grep '^digest ' "$RUNNER_TEMP/dn.log" > "$RUNNER_TEMP/dn.digest" || { cat "$RUNNER_TEMP/dn.log"; exit 1; }
          cmp "$RUNNER_TEMP/cs.digest" "$RUNNER_TEMP/dn.digest"

      - name: Upload golden failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failure-windows-${{ matrix.part }}
          path: ${{ runner.temp }}/golden-tmp
          if-no-files-found: ignore

  # macOS regression gate: scripts/apple-gate.sh --part mac (the single source for CI and manual runs) runs Release build -> C smoke tests -> C# runtime tests -> visual golden -> shader cache round trip.
  # Metal renders on the runner's GPU, so it is not byte-identical, and the golden is a tolerance comparison against Linux *_sdlgpu.png (scripts/png-diff.py).
  # The iOS side (--part ios, running on the simulator) runs in ios.yml.
  macos:
    name: macos (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        # The gate is split into per-shard (APPLE_GATE_SHARD) jobs that run in parallel. Runtime tests can only run one at a time on the runner's GPU
        shard: [1/3, 2/3, 3/3]
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CCACHE_MAXSIZE: 500M
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_OBJC_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4

      # Fetch only the needed submodules, in parallel
      - name: Submodules
        shell: bash
        run: git submodule update --init --depth 1 --jobs 8 third_party/SDL third_party/box2d third_party/box3d third_party/openxr

      # CMake configure downloads the slang prebuilt, so it is cached.
      - name: Cache slang prebuilts
        uses: actions/cache@v4
        with:
          path: third_party/slang/lib
          key: slang-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Deps cache key
        id: deps
        run: bash scripts/deps-cache-key.sh macos >> "$GITHUB_OUTPUT"

      # Install directory of third-party libraries. lub's configure rebuilds them only when the key (cmake/LubDeps.cmake) does not match.
      # The player without slang (build-mac-player) uses the same one.
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            build-mac/deps
            build-mac-player/deps
          key: ${{ steps.deps.outputs.key }}
          restore-keys: ${{ steps.deps.outputs.restore }}

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-macos-${{ github.sha }}
          restore-keys: ccache-macos-

      # run-golden.sh requires bash 4+ (mapfile / wait -n).
      # The bash bundled with macOS is 3.2.
      - name: Install tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: brew install bash ninja

      # Pinned-version ccache (scripts/install-ccache.sh)
      - name: Install ccache
        shell: bash
        run: bash scripts/install-ccache.sh

      # The tests/cs tests and the sample C# are transpiled with tcs before launch, so dotnet is required.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Apple gate, macOS part (build, smokes, C# runtime tests, golden, shader cache)
        run: |
          export TMPDIR="${RUNNER_TEMP}/apple-gate-tmp"
          mkdir -p "$TMPDIR"
          APPLE_GATE_SHARD=${{ matrix.shard }} bash scripts/apple-gate.sh --part mac

      - name: ccache stats
        if: always()
        run: ccache -s

      # The shard that also builds the player without Slang saves it
      - name: Save ccache
        if: github.event_name != 'pull_request' && matrix.shard == '3/3'
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-macos-${{ github.sha }}

      - name: Upload golden failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failure-macos-${{ strategy.job-index }}
          path: ${{ runner.temp }}/apple-gate-tmp
          if-no-files-found: ignore

  # Asset generation + build for the web site (lub.neguse.net).
  # The site builds production only once, and deploy publishes as is the dist (web-dist) that the downstream web-verify and web-export checked.
  # Supply of the prerequisite assets (web/README.md):
  #   - lub player wasm: built in this job with emsdk
  #   - tcs WasmCompiler: content key cache, published with dotnet only on a miss
  web-build:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      EMSDK_VERSION: 5.0.2
      CCACHE_MAXSIZE: 500M
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4

      # Fetch only the needed submodules, in parallel
      - name: Submodules
        shell: bash
        run: git submodule update --init --depth 1 --jobs 8 third_party/SDL third_party/box2d third_party/box3d third_party/openxr third_party/jamo

      - name: Resolve tcs tree hash (cache key)
        id: tcs
        run: echo "sha=$(git rev-parse HEAD:tcs)" >> "$GITHUB_OUTPUT"

      # emsdk is placed at a fixed path (~/emsdk).
      # The setup-emsdk action extracts to a random temp path on every run, so the compiler path changes and the deps key (cmake/LubDeps.cmake) no longer matches.
      - name: Cache emsdk
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}
      - name: Install emsdk
        run: |
          if [ ! -x "$HOME/emsdk/emsdk" ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk "$HOME/emsdk"
          fi
          "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: Deps cache key
        id: deps
        run: bash scripts/deps-cache-key.sh "wasm-emsdk-$EMSDK_VERSION" >> "$GITHUB_OUTPUT"

      # Install directory of third-party libraries. lub's configure rebuilds them only when the key (cmake/LubDeps.cmake) does not match.
      # The tcs2c web player (build/wasm-tcs) uses the same one.
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            build/wasm/deps
            build/wasm-tcs/deps
          key: ${{ steps.deps.outputs.key }}
          restore-keys: ${{ steps.deps.outputs.restore }}

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-wasm-${{ github.sha }}
          restore-keys: ccache-wasm-

      # Pinned-version ccache (scripts/install-ccache.sh)
      - name: Install ccache
        shell: bash
        run: bash scripts/install-ccache.sh

      # Used for the lider bytecode, the tcs wasm assets, and the tcs2c web player
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The builds of the .NET tcs (for the lider bytecode) and tcs2c (for tcs.c of the lider player) that later stages use run in parallel with the wasm build
      - name: Build lub player wasm
        run: |
          (dotnet build tcs/Transpiler -c Release -nologo -v q && dotnet build tcs/tcs2c -c Release -nologo -v q) > "$RUNNER_TEMP/dotnet-build.log" 2>&1 &
          dotnet_build=$!
          source "$HOME/emsdk/emsdk_env.sh"
          emcmake cmake --preset wasm-release
          cmake --build build/wasm -j
          wait "$dotnet_build" || { cat "$RUNNER_TEMP/dotnet-build.log"; exit 1; }
          # An outside project can build its own player with find_package(lub)
          emcmake cmake -S tests/cmake/player -B build/wasm/export-player -G Ninja -Dlub_DIR="$PWD/build/wasm"
          cmake --build build/wasm/export-player

      # The release bundle job (kit) waits for this, so build it and hand it over as soon as what it needs (the lub player wasm) is ready
      # The OS-independent parts of the release bundle: the web tcs VM player (the same one the site serves), the lider bytecode (the same one the site build produces), the kana-kanji conversion dictionary, and the .NET assemblies for .NET execution.
      # The dictionary is determined by build-dict.sh (which fixes the mozc commit to fetch) and the jamo commit, so they are the cache key, and it is built only when missing (same key as the linux lider job)
      - name: Dictionary key
        id: dict
        run: echo "key=mozc-dict-$(git rev-parse HEAD:third_party/jamo)-${{ hashFiles('lider/scripts/build-dict.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Cache the dictionary
        id: dict-cache
        uses: actions/cache@v4
        with:
          path: |
            lider/data/mozc.dict
            lider/data/mozc-README.txt
            lider/data/mozc-LICENSE.txt
          key: ${{ steps.dict.outputs.key }}

      - name: Common parts of the release kit
        run: |
          if [ "${{ steps.dict-cache.outputs.cache-hit }}" != true ]; then
            bash lider/scripts/build-dict.sh lider/data
          fi
          bash lider/scripts/build-module.sh lider/build/web/Lider.tcsb
          mkdir -p common/wasm/vm common/lider common/dict
          cp build/wasm/vm/lub.js build/wasm/vm/lub.wasm common/wasm/vm/
          cp lider/build/web/Lider.tcsb common/lider/
          cp lider/data/mozc.dict lider/data/mozc-README.txt lider/data/mozc-LICENSE.txt common/dict/
          bash scripts/build-dotnet-lib.sh common/dotnet

      - uses: actions/upload-artifact@v4
        with:
          name: kit-common
          path: common
          retention-days: 1

      # Prebuilt kana-kanji conversion (jamo-core, Rust). Its inputs are the jamo commit and the rustc version, and on a hit cargo does not run (JAMO_CACHE in lider/scripts/build-player.sh)
      - name: jamo cache key
        id: jamo
        run: echo "key=jamo-lib-wasm-$(git rev-parse HEAD:third_party/jamo)-$(rustc -V | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

      - name: Cache jamo
        uses: actions/cache@v4
        with:
          path: build-jamo
          key: ${{ steps.jamo.outputs.key }}

      # Player for the lider page (web/lider.html). It uses the lub wasm build via find_package(lub) and statically links the kana-kanji conversion (Rust).
      - name: Build lider player wasm
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          rustup target add wasm32-unknown-emscripten
          JAMO_CACHE="$PWD/build-jamo" bash lider/scripts/build-player.sh --web

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci (postinstall が slang-wasm を fetch)
        working-directory: web
        run: npm ci

      # The only input of the tcs wasm assets is tcs/, so they are cached with a content key, and PRs that do not touch it skip them, dotnet workload included.
      - name: Cache tcs wasm assets
        id: tcs-wasm-cache
        uses: actions/cache@v4
        with:
          path: web/tcs-wasm-assets
          key: tcs-wasm-${{ steps.tcs.outputs.sha }}-${{ hashFiles('web/scripts/gen-tcs-assets.mjs') }}

      # Workloads are installed per SDK version. Run inside the repo so they go into the SDK that the root global.json selects.
      - name: Install wasm-tools workload
        if: steps.tcs-wasm-cache.outputs.cache-hit != 'true'
        run: dotnet workload install wasm-tools

      - name: Generate tcs wasm assets
        if: steps.tcs-wasm-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npm run gen-tcs -- --publish

      - name: Build site
        working-directory: web
        run: npm run build

      # web-verify and web-export wait for this, so hand it over as soon as it is ready.
      # The web dist is only for passing to later jobs in the same run (checks and deploy) and is not used after the run.
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

      # Web player of src/tcs_host.c (tests/c/tcs_shutdown.cs).
      # The web-export job opens it in a page and checks the order in which the page unloads the player.
      - name: Build tcs2c web player
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          bash scripts/web-tcs-host-build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: web-tcs-player
          path: |
            build/wasm-tcs/lub.js
            build/wasm-tcs/lub.wasm

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: Save ccache
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-wasm-${{ github.sha }}


  # Serve dist with vite preview and verify the actual pre-deploy build headlessly.
  # player = the player page (tests/cs, split into 2 jobs with A9_SHARD), lider = the site entry.
  # verify uses threshold checks, so the runner's system chromium is enough.
  web-verify:
    name: web-verify (${{ matrix.page }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # Read this run's artifact list to wait for the web-build artifact
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - page: player
            shard: 1/4
          - page: player
            shard: 2/4
          - page: player
            shard: 3/4
          - page: player
            shard: 4/4
          - page: lider
    steps:
      - uses: actions/checkout@v4

      # The player page check runs bytecode converted from the tests/cs tests by the native tcs.
      - uses: actions/setup-dotnet@v4
        if: matrix.page == 'player'
        with:
          global-json-file: global.json

      - name: Build tests/cs bytecode
        if: matrix.page == 'player'
        shell: bash
        run: |
          dotnet build tcs/Transpiler -c Release -nologo -v q
          export LUB_TCS_DLL="$(find tcs/Transpiler/bin/Release -name Transpiler.dll -print -quit)"
          source scripts/cs-tests.sh
          cs_tests_vm_build

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      # Finish the setup first, then wait here for the site dist (scripts/ci-fetch-artifact.sh)
      - name: Wait for the site (web-dist)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-fetch-artifact.sh web-dist web/dist '^web-build$'

      # Run all tests/cs tests on the web player page (A9 of verify-player).
      - name: Verify player page (${{ matrix.shard }})
        if: matrix.page == 'player'
        working-directory: web
        env:
          A9_SHARD: ${{ matrix.shard }}
        run: |
          npm run preview -- --port 4173 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ >/dev/null && break
            sleep 1
          done
          LUB_URL=http://localhost:4173/ npm run verify

      # Site entry (lider): startup, applying saved edits, diagnostics, side-by-side view, samples, menu and Doc pages, formatting of saved .cs files (verify-lider).
      - name: Verify entry page
        if: matrix.page == 'lider'
        working-directory: web
        run: |
          npm run preview -- --port 4176 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4176/ >/dev/null && break
            sleep 1
          done
          LUB_URL=http://localhost:4176/ npm run verify-lider

      - name: Upload verify screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-screenshots-${{ strategy.job-index }}
          path: /tmp/lub-verify
          if-no-files-found: ignore

  # Open one page written by lub export web (with the web player without slang and the generated cache) in chromium, and check that the tests/cs tests print PASS.
  # export uses the lub built by the linux job, and the player uses the wasm from web-build.
  # The order in which the page unloads the tcs2c player built by web-build is also checked here (since chromium is available).
  web-export:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # Read this run's artifact list to wait for the linux and web-build artifacts
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Restore slang prebuilts
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party/slang/lib
            third_party/slang/bin
          key: slang-dxc-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          fail-on-cache-miss: true

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: Cache playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      # playwright 1.60 does not know ubuntu 26.04 and as is has no download URL for it.
      # The distributed chromium is the same regardless of the ubuntu version, so fetch it as 24.04 (--with-deps is not used because it cannot pull the 26.04 packages).
      - name: Install chromium (playwright)
        working-directory: web
        run: |
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=ubuntu24.04-x64 npx playwright install chromium

      - name: Install the Vulkan loader
        uses: ./.github/actions/apt-install
        with:
          packages: libvulkan1

      # Finish the setup first, then wait here for what linux and web-build produce (scripts/ci-fetch-artifact.sh)
      - name: Wait for lub, the site and the tcs2c web player
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/ci-fetch-artifact.sh lub-linux . '^linux \(runtime\)$'
          bash scripts/ci-fetch-artifact.sh web-dist web/dist '^web-build$'
          bash scripts/ci-fetch-artifact.sh web-tcs-player build/wasm-tcs '^web-build$'

      - name: Web export gate
        run: |
          chmod +x build-release-linux/lub
          mkdir -p build/wasm/vm
          cp web/dist/wasm/vm/lub.js web/dist/wasm/vm/lub.wasm build/wasm/vm/
          bash scripts/web-export-gate.sh build-release-linux/lub

      # When the page unloads the tcs2c player (Module._lub_tcs_shutdown), OnQuit runs exactly once and the player stops.
      - name: tcs2c web player shutdown
        working-directory: web
        run: node scripts/tcs-shutdown-check.mjs ../build/wasm-tcs

  # ---- Tests inside tcs/ ----
  # Tests of tcs itself (the C# compiler and VM). The lub jobs check tcs from the user side; these check it against the tcs spec.
  # The .NET SDK version is pinned by the root global.json.
  # tcs/run-tests.sh is split into per-part (--part) jobs that run in parallel. Parts are split by dotnet test class name, and every test is in exactly one part.
  tcs-test:
    name: tcs-test (${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        part: [transpiler-1, transpiler-2, tcs2c-1, tcs2c-2, tcs2c-3, scripts]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tcs
    steps:
      - uses: actions/checkout@v4

      # Input for spec conformance (examples from the C# spec). Only Transpiler.Tests reads it
      - name: Init csharpstandard
        if: startsWith(matrix.part, 'transpiler-')
        working-directory: .
        run: git submodule update --init --depth 1 tcs/deps/csharpstandard

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run tests and tcs checks
        run: bash run-tests.sh --part ${{ matrix.part }}

  # Performance regression of tcs itself (tcs/perf/selfbench). Measured on the same runner as the PR base (on push, the previous commit), and fails if the deterministic metrics (instruction count, peak managed heap) increase beyond the threshold.
  # Only tcs vm of the C tcs is measured (the same path the lider player uses to convert games inside the page), and time is not measured.
  tcs-selfbench:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tcs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The base measurement depends only on the base tcs tree and the toolchain (the runner image), so the result is cached with them as the key
      - name: Base of the comparison
        id: base
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^1' }}
        run: |
          echo "ref=$BASE" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse "$BASE:tcs")" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Cache the base results
        uses: actions/cache@v4
        with:
          path: tcs/selfbench-base.json
          key: selfbench-base-vm-native-${{ steps.base.outputs.tree }}-${{ steps.base.outputs.image }}

      - name: Install valgrind
        uses: ./.github/actions/apt-install
        with:
          packages: valgrind

      - name: Compare with the base
        run: python3 perf/selfbench/run.py --base "${{ steps.base.outputs.ref }}" --tasks vm --hosts native --runs 0 --base-results selfbench-base.json -o selfbench.json

      - name: Upload selfbench results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcs-selfbench-results
          path: tcs/selfbench.json

  # Build the release bundle (docs/release-kit.md) per target every time, and in a location where only the bundle is extracted, export and check the template, then open and run it in lider.
  # Build lub, tcs (tcs converted to C by tcs2c; also checks that it gives the same output as the .NET tcs), lub-gen, and the lider player on that target, and pack them together with the OS-independent parts (kit-common) built by web-build.
  # On a tag (v*) push, the publish job puts this on the GitHub release.
  kit:
    name: kit (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is built on Ubuntu 24.04 so that it runs on glibc 2.39 environments (such as the claude.ai sandbox)
          - target: linux-x64
            os: ubuntu-24.04
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: windows-x64
            os: windows-latest
            arch: x64
          - target: windows-arm64
            os: windows-11-arm
            arch: arm64
          - target: macos-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Read this run's artifact list to wait for the kit-common artifact
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      CCACHE_MAXSIZE: 500M
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_OBJC_COMPILER_LAUNCHER: ccache
    steps:
      # Git on Windows checks out with CRLF line endings by default. Every bundle is built from the line endings as they are in the repository (LF).
      # With CRLF, line endings in C# multi-line strings differ between .NET and tcs (tcs uses LF), and the lub-gen check also fails
      - name: Check out without converting line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      # The bundle is built in this job, so third-party actions are pinned to a commit
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}

      # A freshly started runner takes about 20 seconds to run the compiler for the first time (the first compile in configure pays for it).
      # Run it once in the background during the later setup (submodules, cache restore)
      - name: Warm up the compilers
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/warm"
          cd "$RUNNER_TEMP/warm"
          printf 'int main(void) { return 0; }\n' > warm.c
          cp warm.c warm.cpp
          (
            cl /nologo warm.c /Fe:warm-c.exe
            cl /nologo warm.cpp /Fe:warm-cxx.exe
            clang-cl /nologo warm.c /Fe:warm-clang-c.exe
            clang-cl /nologo warm.cpp /Fe:warm-clang-cxx.exe
            rustc -V
          ) > warm.log 2>&1 &

      # Fetch only the needed submodules, in parallel
      - name: Submodules
        run: git submodule update --init --depth 1 --jobs 8 third_party/SDL third_party/box2d third_party/box3d third_party/openxr third_party/jamo

      - name: Cache prebuilts
        uses: actions/cache@v4
        with:
          path: |
            third_party/slang/lib
            third_party/slang/bin
            third_party/d3d12agility
          key: release-prebuilt-${{ matrix.target }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Deps cache key
        id: deps
        run: bash scripts/deps-cache-key.sh kit >> "$GITHUB_OUTPUT"

      # Install directory of third-party libraries. lub's configure rebuilds them only when the key (cmake/LubDeps.cmake) does not match
      - name: Cache deps
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: build-kit/deps
          key: ${{ steps.deps.outputs.key }}
          restore-keys: ${{ steps.deps.outputs.restore }}

      - name: Tools cache key
        id: tools
        run: |
          [ "$RUNNER_OS" = Linux ] || export CC=clang
          bash scripts/kit-tools-cache-key.sh ${{ matrix.target }} >> "$GITHUB_OUTPUT"

      # For the C tcs and lub-gen, if the inputs (tcs/ etc.) have the same content, reuse the build that passed the comparison with the .NET version (scripts/kit-tools-cache-key.sh)
      - name: Cache tcs
        id: tcs-cache
        uses: actions/cache@v4
        with:
          path: |
            build-kit/tcs/tcs
            build-kit/tcs/tcs.exe
            build-kit/tcs/runtime
            build-kit/tcs/lib
          key: ${{ steps.tools.outputs.tcs }}

      - name: Cache lub-gen
        id: lub-gen-cache
        uses: actions/cache@v4
        with:
          path: |
            build-kit/tcs/lub-gen
            build-kit/tcs/lub-gen.exe
          key: ${{ steps.tools.outputs.lub-gen }}

      # Pinned-version ccache (scripts/install-ccache.sh)
      - name: Install ccache
        run: bash scripts/install-ccache.sh

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-kit-${{ matrix.target }}-${{ github.sha }}
          restore-keys: ccache-kit-${{ matrix.target }}-

      # mesa-vulkan-drivers (lavapipe) and xvfb are used to render and check the lider in the bundle.
      # Only when building SDL3 (when the deps cache misses on the key), install the dev headers that the SDL3 build needs.
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        with:
          packages: ninja-build patchelf libvulkan-dev mesa-vulkan-drivers xvfb ${{ steps.deps-cache.outputs.cache-hit != 'true' && 'libasound2-dev libpulse-dev libpipewire-0.3-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libdecor-0-dev libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev libudev-dev' || '' }}

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: brew install bash ninja

      # dotnet builds the C tcs and lub-gen (when their caches miss), and the bundle check runs the template with .NET execution
      # On Windows the .NET SDK is not in the image and is fetched every time, so the install directory is fixed and cached
      - name: .NET install dir (Windows)
        if: runner.os == 'Windows'
        run: echo "DOTNET_INSTALL_DIR=C:\dotnet" >> "$GITHUB_ENV"

      - name: Cache .NET (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\dotnet
          key: dotnet-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json') }}

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Prebuilt kana-kanji conversion (jamo-core, Rust). Its inputs are the jamo commit and the rustc version, and on a hit cargo does not run (JAMO_CACHE in lider/scripts/build-player.sh)
      - name: jamo cache key
        id: jamo
        run: echo "key=jamo-lib-${{ matrix.target }}-$(git rev-parse HEAD:third_party/jamo)-$(rustc -V | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

      - name: Cache jamo
        uses: actions/cache@v4
        with:
          path: build-jamo
          key: ${{ steps.jamo.outputs.key }}

      - name: Build lub
        run: |
          cmake -S . -B build-kit -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-kit

      # tcs converted to C by tcs2c (also checks that it gives the same output as the .NET tcs). The generated C uses GNU C statement expressions, so targets other than Linux build it with clang.
      # Remove Platform from env in steps that use dotnet. If the Platform set by msvc-dev-cmd is present, dotnet build output moves to bin/<Platform>/ and the scripts cannot find it
      - name: Build tcs
        if: steps.tcs-cache.outputs.cache-hit != 'true'
        run: |
          unset Platform
          [ "$RUNNER_OS" = Linux ] || export CC=clang
          bash scripts/build-tcs-native.sh build-kit

      # The lider player contains the tcs compiler converted to C (converted by the C tcs above). On Windows it is built with clang-cl, which has the same ABI as MSVC, and linked with the MSVC-built lub
      - name: Build the lider player
        run: |
          unset Platform
          [ "$RUNNER_OS" = Windows ] && export CC=clang-cl CXX=clang-cl
          LUB_BUILD="$PWD/build-kit" JAMO_CACHE="$PWD/build-jamo" bash lider/scripts/build-player.sh

      # Convert lub-gen (TinyC#) to C with the C tcs (also checks that it gives the same output as lub-gen run on .NET)
      - name: Build lub-gen
        if: steps.lub-gen-cache.outputs.cache-hit != 'true'
        run: |
          unset Platform
          [ "$RUNNER_OS" = Linux ] || export CC=clang
          bash scripts/build-lub-gen.sh --verify build-kit

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: Save ccache
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-kit-${{ matrix.target }}-${{ github.sha }}

      # The OS-independent parts are built by web-build. Waiting via needs would start this job's build after web-build, so wait here for the artifact instead
      - name: Wait for the common parts (kit-common)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-fetch-artifact.sh kit-common common '^web-build$'

      - name: Package
        run: bash scripts/package-release.sh ${{ matrix.target }} build-kit common dist

      # In a location where only the bundle is extracted, export and check the template, then open and run it in lider.
      # Rendering: Linux uses lavapipe (CPU Vulkan) and a virtual display, Windows uses WARP (CPU D3D12), macOS uses the runner's GPU
      - name: Verify the kit
        run: |
          kit=$(ls dist/lub-${{ matrix.target }}.*)
          case "$RUNNER_OS" in
            Linux)
              VK_ICD_FILENAMES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)" xvfb-run -a bash scripts/verify-release-kit.sh "$kit"
              ;;
            Windows)
              LUB_D3D12_WARP=1 bash scripts/verify-release-kit.sh "$kit"
              ;;
            *)
              bash scripts/verify-release-kit.sh "$kit"
              ;;
          esac

      - name: Upload the kit
        uses: actions/upload-artifact@v4
        with:
          name: lub-${{ matrix.target }}
          path: dist/lub-${{ matrix.target }}.*

  # Run on the iOS simulator (ios.yml). Called from here only on a tag (v*) push, and publish waits for it.
  # On a master push ios.yml runs on its own, and it does not run on PRs.
  ios:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ios.yml

  gate:
    needs: [lint, format, linux, windows, macos, web-build, web-verify, web-export, tcs-test, tcs-selfbench, kit]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | .key')
          if [ -n "$bad" ]; then
            echo "failed jobs: $bad" >&2
            exit 1
          fi

  # Only on master pushes and on workflow_dispatch on master.
  # Publish as is the dist (web-dist) that web-verify and web-export checked.
  # The local `cd web && npm run deploy` is kept as an escape hatch.
  deploy:
    needs: gate
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Deploy (wrangler)
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

  # On a tag (v*) push, put the checked bundles (lub-<target>.tar.gz, lub-<target>.zip on Windows) on the GitHub release.
  # Tags containing `-` (such as v0.2.0-rc.1) become prereleases (not targeted by releases/latest).
  # The build jobs run third-party actions, so write permissions are given only to this job.
  publish:
    needs: [gate, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lub-*
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=()
          case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes "${pre[@]}"
