# .NET SDK updates arrive as PRs that bump the pin in global.json at the root.
# For a major version update, to keep the SDK and target versions consistent, also bump each project's TargetFramework and LangVersion, and the bin/<configuration>/netN.0 paths in scripts, to the same version.
# Merge after CI passes; after the merge, each machine runs dotnetup sdk install at the repo root to catch up.
version: 2
updates:
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
