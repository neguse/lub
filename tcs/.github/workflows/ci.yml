name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run tests and tcs checks
        run: bash run-tests.sh

  bench-2backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # digest 相互一致 (dev=lua32 / release=tcs2c→C) が fail ゲート。
      # 実行時間は step summary へのレポートのみ (runner の絶対時間は不安定)
      - name: Run 2-backend bench
        run: bash perf/bench-2backend.sh | tee bench-results.csv
        env:
          PERF_BENCH_RUNS: "5"

      - name: Upload bench results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-2backend-results
          path: bench-results.csv

  # 外向けの比較ベンチ (perf/compare) の全実装が同じ出力を出すことを確かめる。時間は測らない (METHODOLOGY.md)
  compare-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Check outputs of all implementations
        run: python3 perf/compare/run.py --check

  # tcs 自身の速さの回帰 (perf/selfbench)。PR の base と同じ runner で交互に測り、
  # 決定的な指標 (命令の数、managed heap の最大) が閾値を超えて増えたら失敗する。時間は step summary に報告だけ
  selfbench:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Compare with the PR base
        run: python3 perf/selfbench/run.py --base "origin/$BASE_REF" --runs 5 -o selfbench.json
        env:
          BASE_REF: ${{ github.base_ref }}

      - name: Upload selfbench results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfbench-results
          path: selfbench.json

  # tcs2c で C にした tcs (SelfHost/native.sh) を 3 OS で作り、.NET の tcs と同じ出力を出すことを確かめる。
  # 作った tcs と一緒に配るファイル (runtime/、lib/) を成果物にする
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            cc: cc
          - os: macos-latest
            name: macos-arm64
            cc: clang
          - os: windows-latest
            name: windows-x64
            cc: clang
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build native tcs and compare with .NET
        run: bash SelfHost/native.sh
        env:
          CC: ${{ matrix.cc }}

      - name: Package
        run: |
          mkdir -p dist/tcs
          cp SelfHost/out/native/tcs* dist/tcs/
          rm -f dist/tcs/tcs.c
          cp -R SelfHost/out/native/runtime SelfHost/out/native/lib dist/tcs/

      - name: Upload native tcs
        uses: actions/upload-artifact@v4
        with:
          name: tcs-${{ matrix.name }}
          path: dist/tcs
